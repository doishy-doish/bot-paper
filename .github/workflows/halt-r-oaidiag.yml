name: halt-r-oaidiag
# OpenAI-compat logprobs diagnostic (report-only, never fails the run).
# Rationale: router-prereg V3 (2026-11-16, user go) — donor-side /completion is
# degenerate on pin a68c6136 (0 probs w/o post_sampling, 1 degenerate w/ it);
# this probes /v1/completions with logprobs for real distributions.
# If depth >= 10 real -> donor-side re-opens; else closure stands.
on:
  push:
    paths:
      - '.github/workflows/halt-r-oaidiag.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  oa-diag:
    name: openai-compat logprobs probe (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build llama.cpp server (pinned)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake > /dev/null 2>&1 || true
          git clone https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout a68c6136bb980d35281ae68d275d6f5318accc4a
          cmake /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release > /tmp/cmake.log 2>&1 || (tail -30 /tmp/cmake.log; exit 1)
          cmake --build /tmp/llama.cpp/build --config Release -j4 > /tmp/build.log 2>&1 || (tail -30 /tmp/build.log; exit 1)
      - name: fetch donor GGUF
        run: |
          curl -sSL --fail "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -o /tmp/donor.gguf
          [ $(wc -c < /tmp/donor.gguf) -gt 100000000 ] || (echo "FAIL donor too small"; exit 1)
      - name: probe openai-compat logprobs (5 prompts x 4 bodies)
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/donor.gguf --port 8080 --ctx-size 64 > /tmp/server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health && break || sleep 5; done
          node - <<'EOF' | tee /tmp/oa-diag-report.json
          const prompts = ["ab", "the cat sat"];
          (async () => {
            const out = [];
            for (const p of prompts) {
              const r = await fetch("http://127.0.0.1:8080/v1/completions", {method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({prompt: p, max_tokens: 1, temperature: 0, logprobs: 10, echo: false})});
              const j = await r.json();
              const ch = j.choices && j.choices[0];
              const lp = ch && ch.logprobs;
              const row = {prompt: p, status: r.status,
                topKeys: j ? Object.keys(j).slice(0,10) : [],
                chKeys: ch ? Object.keys(ch).slice(0,12) : [],
                lpKeys: lp ? Object.keys(lp).slice(0,12) : null,
                lpType: Array.isArray(lp) ? "array" : typeof lp,
                rawSlice: JSON.stringify(lp).slice(0, 600)};
              if (lp && lp.content && lp.content[0]) {
                const c0 = lp.content[0];
                row.c0Keys = Object.keys(c0).slice(0,12);
                const tl = c0.top_logprobs || c0.top_logprobs_compat || [];
                row.topN = Array.isArray(tl) ? tl.length : Object.keys(tl||{}).length;
                row.top3 = (Array.isArray(tl) ? tl.slice(0,3) : []).map(x => [x.token || x.tok_str, x.logprob]);
              }
              out.push(row);
            }
            console.log(JSON.stringify(out));
          })();
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oaidiag-report
          path: /tmp/oa-diag-report.json
          retention-days: 30
