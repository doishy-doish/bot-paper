name: halt-r-v4
# V4.1 donor-side harvest (D1-alone): per-trial donor top-10 via OAI /v1/completions,
# same-trial as banked bench REPORT stream (LCG regen of hopBiDists(TR,2001) positions).
# Pre-regs: scratch/papers/router-v4-prereg-2026-11-16.md (frozen) +
# scratch/papers/router-v4.1-addendum-2026-11-16.md (binds fire+read; D2 DROPPED,
# bar = D1-beats-S1 direction test at matched coverage, McNemar p<0.05).
# Fires ONLY on explicit user go. Free CPU, public repo, no secrets in outputs.
on:
  push:
    paths:
      - '.github/workflows/halt-r-v4.yml'
      - 'halt-r/donor-topk.mjs'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  donor:
    name: v4donor ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - tag: c1-prose
            data: halt-r/c1/corpus-prose.txt
            bytes: 263652
          - tag: c1-math
            data: halt-r/c1/corpus-math.txt
            bytes: 5575
          - tag: ts
            data: /tmp/corpus-ts.txt
            bytes: 0
          - tag: shakes
            data: /tmp/corpus-shakes.txt
            bytes: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch or verify corpus (same recipe as p2log)
        run: |
          if [ "${{ matrix.tag }}" = ts ]; then
            curl -sSL --fail -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus-ts.txt
            [ $(wc -c < /tmp/corpus-ts.txt) -gt 100000 ] || (echo "FAIL ts too small"; exit 1)
          elif [ "${{ matrix.tag }}" = shakes ]; then
            curl -sSL --fail https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus-shakes.txt
            [ $(wc -c < /tmp/corpus-shakes.txt) -gt 100000 ] || (echo "FAIL shakes too small"; exit 1)
          else
            [ $(wc -c < "${{ matrix.data }}") -eq ${{ matrix.bytes }} ] || (echo "FAIL corpus drift ${{ matrix.tag }}"; exit 1)
          fi
          wc -c "${{ matrix.data }}"
      - name: build llama.cpp server (pinned a68c6136)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake > /dev/null 2>&1 || true
          git clone https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout a68c6136bb980d35281ae68d275d6f5318accc4a
          cmake /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release > /tmp/cmake.log 2>&1 || (tail -30 /tmp/cmake.log; exit 1)
          cmake --build /tmp/llama.cpp/build --config Release -j4 > /tmp/build.log 2>&1 || (tail -30 /tmp/build.log; exit 1)
      - name: fetch donor GGUF (q05, same donor as oaidiag/M11)
        run: |
          curl -sSL --fail "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -o /tmp/donor.gguf
          [ $(wc -c < /tmp/donor.gguf) -gt 100000000 ] || (echo "FAIL donor too small"; exit 1)
      - name: harvest donor top-10 (same-trial regen, report-only)
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/donor.gguf --port 8080 --ctx-size 128 > /tmp/server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health && break || sleep 5; done
          node halt-r/donor-topk.mjs --data "${{ matrix.data }}" --tag ${{ matrix.tag }} --out out/v4donor-${{ matrix.tag }}/donor-topk.json --server http://127.0.0.1:8080 --donor qwen2.5-0.5b-instruct-q4_k_m --pin a68c6136 2>&1 | tee /tmp/harvest-${{ matrix.tag }}.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4donor-${{ matrix.tag }}
          path: out/v4donor-${{ matrix.tag }}/donor-topk.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v4donor-log-${{ matrix.tag }}
          path: |
            /tmp/harvest-${{ matrix.tag }}.log
            /tmp/server.log
          retention-days: 7
