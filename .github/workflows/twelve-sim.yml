name: twelve-sim
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/twelve-sim.yml'
permissions:
  contents: read
jobs:
  sim:
    name: twelve sim (test.sh + k6 smoke, kensac vs rust-direct)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout self (our entries)
        uses: actions/checkout@v4
        with:
          path: self
      - name: checkout upstream challenge
        uses: actions/checkout@v4
        with:
          repository: arjaythedev/twelve-dollar-server-challenge
          ref: main
          path: upstream
      - name: record versions
        run: |
          echo "self: $(cd self && git rev-parse --short HEAD) $(cd self && git log -1 --format=%ci)"
          echo "upstream: $(cd upstream && git rev-parse --short HEAD) $(cd upstream && git log -1 --format=%ci)"
          uname -a
          cat /proc/cpuinfo | grep "model name" | head -1
          nproc; free -h
          sysctl -n net.core.somaxconn || true
          # io_uring probe: kensac needs 6.1+ DEFER_TASKRUN/multishot; record kernel support signal
          python3 -c "import os; print('has io_uring_enter:', hasattr(os, 'set_blocking'))" || true
          ls -la upstream/seed/ upstream/test/ upstream/bench/ | head -30
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates unzip xz-utils pkg-config libssl-dev sqlite3 jq openssl python3
      - name: install k6 (pinned binary, no apt keyserver)
        run: |
          K6_VER=0.53.0
          curl -sSL --retry 3 -o /tmp/k6.tar.gz "https://github.com/grafana/k6/releases/download/v${K6_VER}/k6-v${K6_VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv "/tmp/k6-v${K6_VER}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
      - name: setup node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: rust cache (both workspaces)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            self/twelve/submissions/rust-direct-challenger
            upstream/submissions/rust-iouring-kensac
      - name: install rust toolchains (both entries)
        run: |
          # ours: rustup 1.89.0 (pinned in our install.sh)
          if ! command -v rustup >/dev/null 2>&1; then curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.89.0 --profile minimal || true
          rustup default 1.89.0 || true
          # kensac: standalone 1.94.0 to /usr/local (needs sudo, sha256-checked upstream)
          sudo bash upstream/submissions/rust-iouring-kensac/install.sh
          cargo --version; rustc --version
          /usr/local/bin/cargo --version || true
      - name: build seed DB
        run: |
          cd upstream
          bash seed/make-seed.sh
          ls -lh seed/feed.db seed/tokens.json
      - name: official 42-check suite, both entries (via test/run.sh = build + start + test)
        run: |
          set +e
          echo "=== kensac test/run.sh ==="
          bash upstream/test/run.sh upstream/submissions/rust-iouring-kensac 2>&1 | tee /tmp/test-kensac.log; K_RC=${PIPESTATUS[0]}
          echo "kensac test exit: $K_RC"
          echo "=== rust-direct test/run.sh ==="
          bash upstream/test/run.sh self/twelve/submissions/rust-direct-challenger 2>&1 | tee /tmp/test-ours.log; O_RC=${PIPESTATUS[0]}
          echo "ours test exit: $O_RC"
          echo "K_RC=$K_RC O_RC=$O_RC" | tee /tmp/test-rc.env
          # do not fail the job here: kensac may refuse io_uring on hosted runners; summary reports it
          exit 0
      - name: k6 smoke (VUS=50, 30s hold each, fresh DB per server)
        run: |
          set -u
          export PATH="/usr/local/bin:$HOME/.cargo/bin:$PATH"
          start_server() { # <submission-dir> <port> <db> <log>
            local dir="$1" port="$2" db="$3" log="$4"
            cp upstream/seed/feed.db "$db"
            SQLITE_PATH="$db" JWT_SECRET=twelve-dollar-challenge HOST=127.0.0.1 PORT="$port" bash "$dir/start.sh" > "$log" 2>&1 &
            echo $! > "/tmp/srv-$port.pid"
            for _ in $(seq 1 60); do curl -sf "http://127.0.0.1:$port/health" >/dev/null 2>&1 && break; sleep 1; done
            curl -sf "http://127.0.0.1:$port/health" || { echo "server on $port failed to start; log:"; tail -40 "$log"; return 1; }
          }
          K_OK=0; O_OK=0
          start_server "upstream/submissions/rust-iouring-kensac" 3001 /tmp/kensac.db /tmp/srv-kensac.log || K_OK=$?
          # fresh DB for golden checks inside k6? No: k6 writes, so copy fresh again before each k6 run per official bench (restart on fresh DB)
          if [ "$K_OK" = 0 ]; then
            cp upstream/seed/feed.db /tmp/kensac.db
            # restart kensac on the fresh copy (kill + start) so k6 measures a clean DB like the official bench
            kill "$(cat /tmp/srv-3001.pid)" 2>/dev/null || true; sleep 2
            start_server "upstream/submissions/rust-iouring-kensac" 3001 /tmp/kensac.db /tmp/srv-kensac.log || K_OK=$?
          fi
          start_server "self/twelve/submissions/rust-direct-challenger" 3002 /tmp/ours.db /tmp/srv-ours.log || O_OK=$?
          if [ "$O_OK" = 0 ]; then
            kill "$(cat /tmp/srv-3002.pid)" 2>/dev/null || true; sleep 2
            start_server "self/twelve/submissions/rust-direct-challenger" 3002 /tmp/ours.db /tmp/srv-ours.log || O_OK=$?
          fi
          echo "K_OK=$K_OK O_OK=$O_OK" | tee /tmp/srv-status.env
          if [ "$K_OK" = 0 ]; then
            echo "--- k6 kensac VUS=50 30s ---"
            BASE_URL=http://127.0.0.1:3001 VUS=50 DURATION=30s RAMP_UP=10s TOKENS=upstream/seed/tokens.json k6 run --summary-export /tmp/k6-kensac.json upstream/bench/load.js 2>&1 | tee /tmp/k6-kensac.log | tail -25
          else
            echo "SKIP k6 kensac (server did not start; likely io_uring blocked on hosted runner)"
          fi
          if [ "$O_OK" = 0 ]; then
            echo "--- k6 ours VUS=50 30s ---"
            BASE_URL=http://127.0.0.1:3002 VUS=50 DURATION=30s RAMP_UP=10s TOKENS=upstream/seed/tokens.json k6 run --summary-export /tmp/k6-ours.json upstream/bench/load.js 2>&1 | tee /tmp/k6-ours.log | tail -25
          else
            echo "ours failed to start (unexpected: epoll/tokio should run anywhere)"
          fi
          kill "$(cat /tmp/srv-3001.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/srv-3002.pid 2>/dev/null)" 2>/dev/null || true
          pkill -f twelve-direct || true; pkill -f feed-server || true
          echo "smoke done"
          exit 0
      - name: "summarize (honest: runner is relative, never the official score)"
        run: |
          node - <<'EOF' | tee /tmp/twelve-summary.md
          const fs = require('node:fs');
          const read = p => { try { return fs.readFileSync(p, 'utf8'); } catch { return null; } };
          const testK = read('/tmp/test-kensac.log') || '', testO = read('/tmp/test-ours.log') || '';
          const k6K = read('/tmp/k6-kensac.log') || '', k6O = read('/tmp/k6-ours.log') || '';
          const last = (s, pat) => (s.split('\n').filter(l => pat.test(l)).slice(-3).join('\n'));
          const passed = s => { const m = s.match(/passed=(\d+) failed=(\d+)/); return m ? m[0] : 'no passed/failed line'; };
          let md = '# twelve-sim (GitHub runner: relative signal, NOT the official score)\n\n';
          md += 'Hosted runner is a shared 2-4 vCPU VM with noisy neighbors; the official box is a dedicated 1 vCPU Synteq VPS with a 16-core load rig and 5-min holds. Same-machine + same k6 smoke here measures _relative_ health only.\n\n';
          md += '## test.sh (42 checks, fresh DB)\n';
          md += '- kensac: ' + passed(testK) + '\n- ours (rust-direct): ' + passed(testO) + '\n';
          md += '\n## k6 smoke (VUS=50, 30s hold + 10s ramp, same runner, same script)\n';
          const grab = s => last(s, /http_req|checks|failed|p\(95\)|data_received|vus/i) || '(no k6 output: server did not start or k6 skipped)';
          md += '### kensac k6 tail\n```\n' + grab(k6K) + '\n```\n### ours k6 tail\n```\n' + grab(k6O) + '\n```\n';
          md += '\n## how to read this\n- If both pass test.sh and both complete k6 with 0 failed checks, the entries are functionally equivalent at smoke scale; the req/s gap here is scheduling noise + shared-CPU, not rank.\n- If kensac fails to start (io_uring blocked) while ours starts, that is a portability signal in our favor for constrained hosts, not a performance claim.\n- Real verdict needs the official bench (16-core rig, 2-min probes + 5-min holds). This job is pre-benchmark signal only.\n';
          process.stdout.write(md);
          EOF
          cat /tmp/twelve-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: upload logs
        uses: actions/upload-artifact@v4
        with:
          name: twelve-sim-logs
          path: |
            /tmp/test-kensac.log
            /tmp/test-ours.log
            /tmp/k6-kensac.log
            /tmp/k6-ours.log
            /tmp/k6-kensac.json
            /tmp/k6-ours.json
            /tmp/srv-kensac.log
            /tmp/srv-ours.log
            /tmp/twelve-summary.md
          retention-days: 30
          if-no-files-found: warn
