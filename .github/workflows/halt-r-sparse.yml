name: halt-r-sparse
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-sparse.yml'
permissions:
  contents: write
jobs:
  bench:
    name: sparse ${{ matrix.corpus }} W${{ matrix.W }} s${{ matrix.sparse }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        sparse: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: bench sparse assignment + hedge (JS-only, same code path)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/sparse-${{ matrix.corpus }}-W${{ matrix.W }}-s${{ matrix.sparse }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj sup --H 256 --sparse ${{ matrix.sparse }} --hedge 1 --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: sparse-${{ matrix.corpus }}-W${{ matrix.W }}-s${{ matrix.sparse }}
          path: out/sparse-${{ matrix.corpus }}-W${{ matrix.W }}-s${{ matrix.sparse }}/
          retention-days: 30
  collect:
    name: collect sparse + hedge verdicts
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sparse-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: sparse-sharpness + hedge-regret verdicts (paired McNemar)
        run: |
          node - <<'EOF' | tee /tmp/sparse.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || a.sparse - b.sparse);
          fs.writeFileSync('/tmp/sparse.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'sparse-hedge', runs}, null, 1));
          let md = '# S: entmax-1.5 sparse assignment + Hedge mixing (measured, CI)\nSame protocol (P=8000, sup, no-gen). Sparse keeps the argmax, sharpens the mixture (support 253->2 in prototype). Hedge mixes the LAMBDAS grid with regret bounds. Paired McNemar on identical queries.\n\n| corpus | W | sparse | cost | interp acc/ppl (lam*) | hedge acc/ppl (neff) |\n|---|---|---|---|---|---|\n';
          for (const r of runs) md += '| ' + r.corpus + ' | ' + r.W + ' | ' + r.sparse + ' | ' + (r.costClass || '?') + ' | ' + r.interpAcc.toFixed(3) + '/' + r.interpPpl.toFixed(2) + ' (' + r.interpLambda + ') | ' + r.hedgeAcc.toFixed(3) + '/' + r.hedgePpl.toFixed(2) + ' (' + r.hedgeNeff.toFixed(1) + ') |\n';
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const s0 = runs.find(r => r.corpus === corpus && r.W === W && r.sparse === 0);
            const s1 = runs.find(r => r.corpus === corpus && r.W === W && r.sparse === 1);
            if (!s0 || !s1) continue;
            const pm = pair(s1.repHitI || '', s0.repHitI || '');
            const wins = s1.interpPpl < s0.interpPpl;
            md += '\n' + corpus + ' W' + W + ' sparse-vs-softmax: ' + s0.interpPpl.toFixed(2) + ' -> ' + s1.interpPpl.toFixed(2) + ' McNemar b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + (pm.p < 0.05 ? ' SIGNIFICANT.' : '.') + ' ' + (wins && pm.p < 0.05 ? 'VERDICT: SHARPNESS WINS.' : wins ? 'VERDICT: leans sparse, not significant.' : 'VERDICT: SPARSE FAILS.') + '\n';
            const hm = s1.hedgePpl < s1.interpPpl;
            md += corpus + ' W' + W + ' hedge-vs-bestlam: ' + s1.interpPpl.toFixed(2) + ' -> ' + s1.hedgePpl.toFixed(2) + ' (neff=' + s1.hedgeNeff.toFixed(1) + '). ' + (hm ? 'VERDICT: ONLINE MIXING WINS.' : 'VERDICT: fixed lam stands.') + '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/sparse.json halt-r/sparse.json
          cp /tmp/sparse.md halt-r/sparse.md
          cat halt-r/sparse.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit sparse back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sparse.json halt-r/sparse.json
            cp /tmp/sparse.md halt-r/sparse.md
            git add halt-r/sparse.json halt-r/sparse.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: sparse-hedge $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
