name: halt-r-h6
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-h6.yml'
permissions:
  contents: write
jobs:
  bench:
    name: h6 ${{ matrix.corpus }} W${{ matrix.W }} h6-${{ matrix.h6 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        h6: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          head -c 200 /tmp/corpus.txt
      - name: bench fixed lambda vs learned gate
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/h6-${{ matrix.corpus }}-W${{ matrix.W }}-h${{ matrix.h6 }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj sup --H 256 --ada 0 --score whole --capab none --h6 ${{ matrix.h6 }} --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: h6-${{ matrix.corpus }}-W${{ matrix.W }}-h${{ matrix.h6 }}
          path: out/h6-${{ matrix.corpus }}-W${{ matrix.W }}-h${{ matrix.h6 }}/
          retention-days: 30
  collect:
    name: collect learned-gate verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: h6-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: gate table plus verdict
        run: |
          node - <<'EOF' | tee /tmp/h6.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          try { walk('models'); } catch (e) { console.log('no metrics found'); process.exit(0); }
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || a.h6 - b.h6);
          fs.writeFileSync('/tmp/h6.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'h6-learned-gate', runs}, null, 1));
          let md = '# H6: learned 6-feature gate vs fixed lambda (consolidate-wins scope)\nSame protocol as H1 (P=8000, sup, fixed lam, no-gen). Gate L = lam * P(helps), 6-feature logistic fit on seed-2000, locked seed-2001. Bounded claim: consolidates configs where retrieval works; no W16-crack claim.\n\n| corpus | W | mode | interp acc/ppl (lam*) | AUC |\n|---|---|---|---|---|\n';
          for (const m of runs) {
            const v = m.h6 === 0 ? (m.interpAcc.toFixed(3) + '/' + m.interpPpl.toFixed(2) + ' (' + m.interpLambda + ')') : (m.h6Acc.toFixed(3) + '/' + m.h6Ppl.toFixed(2) + ' (' + m.h6LamSel + ')');
            md += '| ' + m.corpus + ' | ' + m.W + ' | ' + (m.h6 === 0 ? 'fixed' : 'gate') + ' | ' + v + ' | ' + (m.h6 === 0 ? '-' : m.h6AUC.toFixed(3)) + ' |\n';
          }
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const g = runs.filter(m => m.corpus === corpus && m.W === W);
            if (g.length < 2) continue;
            const f = g.find(m => m.h6 === 0), b = g.find(m => m.h6 === 1);
            if (!f || !b) continue;
            const d = f.interpPpl - b.h6Ppl;
            md += '\n' + corpus + ' W' + W + ': fixed interpPpl=' + f.interpPpl.toFixed(2) + ' vs gate interpPpl=' + b.h6Ppl.toFixed(2) + ' (AUC ' + b.h6AUC.toFixed(3) + ') d=' + d.toFixed(2) + '. ';
            md += (d > 0 ? 'VERDICT: GATE CONSOLIDATES.' : 'VERDICT: GATE HOLDS (fixed stands).');
            md += '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/h6.json halt-r/h6.json
          cp /tmp/h6.md halt-r/h6.md
          cat halt-r/h6.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit h6 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/h6.json halt-r/h6.json
            cp /tmp/h6.md halt-r/h6.md
            git add halt-r/h6.json halt-r/h6.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: h6 learned-gate $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
