name: debug-micro
# TEMPORARY triage workflow (TM precedent): re-runs ONLY the failed micro leg,
# prints the guard-relevant header, encrypts + commits the single summary so it
# is readable via the contents API. DELETE after triage (public + local).
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: |
          git clone --depth 1 "https://x-access-token:${BRAIN_PAT}@github.com/doishy-doish/bot-paper-brain.git" /tmp/brain
        env:
          BRAIN_PAT: ${{ secrets.BRAIN_PAT }}
      - run: python /tmp/brain/scripts/backtest.py --quiet --mean-rev-sharp --drop 6.5 --hold 10 --stop 10 --slots 1 --cash-yield-hist --yield-tax 0.30 --composite --dp-charge 147.5 --trials 117 --out /tmp/backtest_mr_micro.json
      - run: |
          rm -rf /tmp/brain
          rm -f results_trades.csv
      - run: |
          ls -la /tmp/ > /tmp/ls.txt 2>&1 || true
          ls -la . >> /tmp/ls.txt 2>&1 || true
          head -c 3000 /tmp/backtest_mr_micro.json > /tmp/head.txt 2>&1 || echo NOFILE > /tmp/head.txt
          wc -c /tmp/backtest_mr_micro.json >> /tmp/ls.txt 2>&1 || true
          mkdir -p data
          cp /tmp/ls.txt data/debug_micro_ls.txt
          cp /tmp/head.txt data/debug_micro_head.txt
      - run: node scripts/scramble.mjs encrypt data/debug_micro_ls.txt data/debug_micro_head.txt
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
      - run: |
          git config user.name "debug-micro"
          git config user.email "debug-micro@users.noreply.github.com"
          git add data/debug_micro_ls.txt data/debug_micro_head.txt
          git diff --cached --quiet || git commit -m "debug-micro $(date -u +%F_%T)"
          git pull --rebase
          git push
