name: halt-r-dtw
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-dtw.yml'
permissions:
  contents: write
jobs:
  bench:
    name: dtw ${{ matrix.corpus }} W${{ matrix.W }} d${{ matrix.dtw }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        dtw: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          head -c 200 /tmp/corpus.txt
      - name: bench dtw rerank
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/dtw-${{ matrix.corpus }}-W${{ matrix.W }}-d${{ matrix.dtw }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj sup --H 256 --ada 0 --score whole --capab none --h6 0 --split 0 --pen 0 --prov 0 --dtw ${{ matrix.dtw }} --smp 0 --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: dtw-${{ matrix.corpus }}-W${{ matrix.W }}-d${{ matrix.dtw }}
          path: out/dtw-${{ matrix.corpus }}-W${{ matrix.W }}-d${{ matrix.dtw }}/
          retention-days: 30
  collect:
    name: collect dtw verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dtw-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dtw table plus verdict
        run: |
          node - <<'EOF' | tee /tmp/dtw.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          try { walk('models'); } catch (e) { console.log('no metrics found'); process.exit(0); }
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || a.dtw - b.dtw);
          fs.writeFileSync('/tmp/dtw.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'dtw-rerank', preReg: 'dtwPpl < interpPpl - 0.2 AND McNemar p<0.05 (repHitD vs repHitI); K=50 tau=W fixed; screen: shift 0.74 rev 0.00', runs}, null, 1));
          function mcnemar(b, c) { const n = b + c; if (!n) return 1; const m = Math.min(b, c); let s = 0, t = 1; for (let k = 0; k <= n; k++) { if (k <= m) s += t; t = t * (n - k) / (k + 1); } return Math.min(1, 2 * s / Math.pow(2, n)); }
          let md = '# DTW rerank vs sup prefilter\nSame protocol (P=8000, sup, W8/W16, --no-gen). Top-50 store weights reranked by DTW distance (0/1 frame cost, tau=W). Pre-reg: dtwPpl < interpPpl - 0.2 AND McNemar p<0.05.\n\n| corpus | W | dtw | lam* | acc | ppl | cost |\n|---|---|---|---|---|---|---|\n';
          for (const m of runs) {
            md += '| ' + m.corpus + ' | ' + m.W + ' | ' + m.dtw + ' | ' + (m.dtw ? m.dtwLamSel : m.interpLambda) + ' | ' + (m.dtw ? m.dtwAcc : m.interpAcc).toFixed(3) + ' | ' + (m.dtw ? m.dtwPpl : m.interpPpl).toFixed(2) + ' | ' + m.costClass + ' |\n';
          }
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const g = runs.filter(m => m.corpus === corpus && m.W === W);
            const f = g.find(m => m.dtw === 0), d = g.find(m => m.dtw === 1);
            if (!f || !d || !d.repHitD || !f.repHitI) { md += '\n' + corpus + ' W' + W + ': INCOMPLETE (missing pair).\n'; continue; }
            const dppl = f.interpPpl - d.dtwPpl;
            let b = 0, c = 0;
            for (let i = 0; i < f.repHitI.length && i < d.repHitD.length; i++) { if (f.repHitI[i] === '1' && d.repHitD[i] === '0') b++; else if (f.repHitI[i] === '0' && d.repHitD[i] === '1') c++; }
            const p = mcnemar(b, c);
            const win = dppl > 0.2 && p < 0.05;
            md += '\n' + corpus + ' W' + W + ': interp ' + f.interpPpl.toFixed(2) + ' vs dtw ' + d.dtwPpl.toFixed(2) + ' (d=' + dppl.toFixed(2) + ', McNemar b=' + b + ' c=' + c + ' p=' + p.toFixed(4) + '). ';
            md += win ? 'VERDICT: DTW MOVES (rerank carries — geometry lives behind the prefilter).' : 'VERDICT: DTW HOLDS (rerank does not carry — wall stays semantic).';
            md += '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/dtw.json halt-r/dtw.json
          cp /tmp/dtw.md halt-r/dtw.md
          cat halt-r/dtw.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit dtw back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dtw.json halt-r/dtw.json
            cp /tmp/dtw.md halt-r/dtw.md
            git add halt-r/dtw.json halt-r/dtw.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: dtw rerank $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
