name: backtest
# Scrambled: public runner computes, but data/*.json are AES-256-GCM ciphertext.
# Decrypt on our side after pull (see SCRAMBLE.md). Triggers stay
# schedule/dispatch ONLY — never add pull_request (that would expose
# BRAIN_PAT / SCRAMBLE_KEY to forked runs).
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: |
          git clone --depth 1 "https://x-access-token:${BRAIN_PAT}@github.com/doishy-doish/bot-paper-brain.git" /tmp/brain
        env:
          BRAIN_PAT: ${{ secrets.BRAIN_PAT }}
      - run: |
          mkdir -p data
          python /tmp/brain/scripts/backtest.py --quiet --null --out data/backtest_null.json
          python /tmp/brain/scripts/backtest.py --quiet --out data/backtest.json
          python /tmp/brain/scripts/backtest.py --quiet --nifty-filter --out data/backtest_nifty.json
          python /tmp/brain/scripts/backtest.py --quiet --vol-target --out data/backtest_vol.json
          python /tmp/brain/scripts/backtest.py --quiet --momentum-rank --out data/backtest_mom.json
          python /tmp/brain/scripts/backtest.py --quiet --mean-rev --out data/backtest_mr.json
          python /tmp/brain/scripts/backtest.py --quiet --mean-rev-sharp --out data/backtest_mr_sharp.json
          python /tmp/brain/scripts/backtest.py --quiet --start 2024-01-01 --trials 8 --out data/backtest_valid.json
          python /tmp/brain/scripts/backtest.py --quiet --mean-rev-sharp --start 2024-01-01 --trials 8 --out data/backtest_mr_sharp_valid.json
          rm -rf /tmp/brain
          rm -f results_trades.csv
      - run: |
          node -e '
          const fs = require("fs");
          for (const f of ["data/backtest.json", "data/backtest_null.json", "data/backtest_nifty.json", "data/backtest_vol.json", "data/backtest_mom.json", "data/backtest_mr.json", "data/backtest_mr_sharp.json", "data/backtest_valid.json", "data/backtest_mr_sharp_valid.json"]) {
            if (!fs.existsSync(f)) throw new Error("missing " + f);
          }
          const n = JSON.parse(fs.readFileSync("data/backtest_nifty.json", "utf8"));
          if (!n.nifty_filter) throw new Error("STALE BRAIN COPY: backtest.py ignored --nifty-filter (sync brain scripts/backtest.py from src/bot/backtest.py)");
          console.log("guard ok: nifty_filter=true, trades=" + n.trades);
          const v = JSON.parse(fs.readFileSync("data/backtest_vol.json", "utf8"));
          if (!v.vol_target) throw new Error("STALE BRAIN COPY: backtest.py ignored --vol-target (sync brain scripts/backtest.py from src/bot/backtest.py)");
          console.log("guard ok: vol_target=true, trades=" + v.trades + " avg_size=" + v.avg_size);
          const m = JSON.parse(fs.readFileSync("data/backtest_mom.json", "utf8"));
          if (!m.mom_rank) throw new Error("STALE BRAIN COPY: backtest.py ignored --momentum-rank (sync brain scripts/backtest.py from src/bot/backtest.py)");
          console.log("guard ok: mom_rank=true, trades=" + m.trades);
          for (const [f, key] of [["data/backtest_mr.json", "mr_variant"], ["data/backtest_mr_sharp.json", "mr_variant"]]) {
            const r = JSON.parse(fs.readFileSync(f, "utf8"));
            if (!r[key]) throw new Error("STALE BRAIN COPY: backtest.py ignored " + f + " flag (sync brain scripts/backtest.py from src/bot/backtest.py)");
            console.log("guard ok: " + f + " variant=" + r[key] + " trades=" + r.trades);
          }
          for (const [f, key] of [["data/backtest_valid.json", null], ["data/backtest_mr_sharp_valid.json", "mr_variant"]]) {
            const r = JSON.parse(fs.readFileSync(f, "utf8"));
            if ((r.window || {}).start !== "2024-01-01") throw new Error("STALE BRAIN COPY: " + f + " missing --start 2024-01-01 (sync brain scripts/backtest.py)");
            if (key && !r[key]) throw new Error("STALE BRAIN COPY: " + f + " missing flag");
            if (r.trials !== 8) throw new Error("STALE BRAIN COPY: " + f + " trials=" + r.trials + " want 8");
            console.log("guard ok: " + f + " window=" + r.window.start + " trades=" + r.trades);
          }
          '
      - run: node scripts/scramble.mjs encrypt data/backtest.json data/backtest_null.json data/backtest_nifty.json data/backtest_vol.json data/backtest_mom.json data/backtest_mr.json data/backtest_mr_sharp.json data/backtest_valid.json data/backtest_mr_sharp_valid.json
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
      - run: |
          git config user.name "paper-tick"
          git config user.email "paper-tick@users.noreply.github.com"
          git add data/backtest.json data/backtest_null.json data/backtest_nifty.json data/backtest_vol.json data/backtest_mom.json data/backtest_mr.json data/backtest_mr_sharp.json data/backtest_valid.json data/backtest_mr_sharp_valid.json
          git diff --cached --quiet || git commit -m "backtest $(date -u +%F)"
          git push
