          - {name: backtest_mr_slot6, flags: "--mean-rev-sharp --drop 6.5 --hold 10 --stop 10 --slots 6 --slot-cap --cash-yield-hist --yield-tax 0.30 --composite --dp-charge 147.5 --trials 123", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_slot8, flags: "--mean-rev-sharp --drop 6.5 --hold 10 --stop 10 --slots 8 --slot-cap --cash-yield-hist --yield-tax 0.30 --composite --dp-charge 147.5 --trials 124", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_hu025, flags: "--mean-rev-sharp --drop 6.5 --hold 10 --stop 10 --slots 10 --cash-yield-hist --yield-tax 0.30 --composite --inv-penalty 0.25 --trials 125", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_hu20, flags: "--mean-rev-sharp --drop 6.5 --hold 10 --stop 10 --slots 10 --cash-yield-hist --yield-tax 0.30 --composite --inv-penalty 2.0 --trials 126", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_q10exp, flags: "--mean-rev-sharp --drop 6.5 --hold 10 --stop 10 --slots 10 --cash-yield-hist --yield-tax 0.30 --composite --trials 127 --start 2021-01-01 --end 2023-12-31", expect_key: "mr_variant", expect_window: "2021-01-01"}
          - {name: backtest_mr_q10val, flags: "--mean-rev-sharp --drop 6.5 --hold 10 --stop 10 --slots 10 --cash-yield-hist --yield-tax 0.30 --composite --trials 128 --start 2024-01-01", expect_key: "mr_variant", expect_window: "2024-01-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: leg filter
        id: gate
        run: |
          ONLY='${{ inputs.only_legs }}'
          if [ -z "$ONLY" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          case ",$ONLY," in
            *",${{ matrix.name }},"*) echo "run=yes" >> "$GITHUB_OUTPUT";;
            *) echo "Skipping ${{ matrix.name }} (not in only_legs)"; echo "run=no" >> "$GITHUB_OUTPUT";;
          esac
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
        if: steps.gate.outputs.run == 'yes'
      - run: |
          git clone --depth 1 "https://x-access-token:${BRAIN_PAT}@github.com/doishy-doish/bot-paper-brain.git" /tmp/brain
        if: steps.gate.outputs.run == 'yes'
        env:
          BRAIN_PAT: ${{ secrets.BRAIN_PAT }}
      - run: python /tmp/brain/scripts/backtest.py --quiet ${{ matrix.flags }} --out /tmp/${{ matrix.name }}.json
        if: steps.gate.outputs.run == 'yes'
      - run: |
          rm -rf /tmp/brain
          rm -f results_trades.csv
        if: steps.gate.outputs.run == 'yes'
      - run: |
          node -e '
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync(process.env.OUT_FILE, "utf8"));
          if (s.trades === 0 && s.reason === "no trades") { console.log("guard ok: valid dead leg (0 trades) in " + process.env.OUT_FILE); process.exit(0); }
          if (!s.trades) throw new Error("STALE/EMPTY: no trades in " + process.env.OUT_FILE);
          if (process.env.EXPECT_KEY && !s[process.env.EXPECT_KEY]) throw new Error("STALE BRAIN COPY: expected truthy " + process.env.EXPECT_KEY + " (sync brain scripts/backtest.py from src/bot/backtest.py)");
          if (process.env.EXPECT_WINDOW && ((s.window || {}).start !== process.env.EXPECT_WINDOW)) throw new Error("STALE BRAIN COPY: window mismatch in " + process.env.OUT_FILE + " (sync brain scripts/backtest.py)");
          console.log("guard ok: " + process.env.OUT_FILE + " trades=" + s.trades);
          '
        if: steps.gate.outputs.run == 'yes'
        env:
          OUT_FILE: /tmp/${{ matrix.name }}.json
          EXPECT_KEY: ${{ matrix.expect_key }}
          EXPECT_WINDOW: ${{ matrix.expect_window }}
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          name: ${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.json
          if-no-files-found: error
  collect:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: "backtest*"
      - run: |
          mkdir -p data
          for f in artifacts/*/*.json; do cp "$f" "data/$(basename $f)"; done
          ls data/
      - run: node scripts/scramble.mjs encrypt data/backtest*.json
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
      - run: |
          git config user.name "paper-tick"
          git config user.email "paper-tick@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "backtest $(date -u +%F)"
          git pull --rebase
          git push
