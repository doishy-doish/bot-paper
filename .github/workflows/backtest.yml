name: backtest
# Scrambled: public runner computes, but data/*.json are AES-256-GCM ciphertext.
# Decrypt on our side after pull (see SCRAMBLE.md). Triggers stay
# schedule/dispatch ONLY — never add pull_request (that would expose
# BRAIN_PAT / SCRAMBLE to forked runs).
#
# Architecture (Batch-3 ready): ONE matrix job fans out to N parallel
# backtests (public minutes are unlimited; free-plan concurrency fits ~20
# jobs, so a 20-variant batch collapses to single-run wall time). Each
# matrix job uploads its plaintext JSON as an artifact; the `collect` job
# downloads all, encrypts, and makes the ONE commit. Never commit from
# matrix jobs (parallel pushes conflict). Matrix jobs need BRAIN_PAT only
# for the read-only brain clone.
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backtest, flags: "", expect_key: "", expect_window: ""}
          - {name: backtest_null, flags: "--null", expect_key: "null_seed", expect_window: ""}
          - {name: backtest_nifty, flags: "--nifty-filter", expect_key: "nifty_filter", expect_window: ""}
          - {name: backtest_vol, flags: "--vol-target", expect_key: "vol_target", expect_window: ""}
          - {name: backtest_mom, flags: "--momentum-rank", expect_key: "mom_rank", expect_window: ""}
          - {name: backtest_mr, flags: "--mean-rev", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_sharp, flags: "--mean-rev-sharp", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_valid, flags: "--start 2024-01-01 --trials 8", expect_key: "", expect_window: "2024-01-01"}
          - {name: backtest_mr_sharp_valid, flags: "--mean-rev-sharp --start 2024-01-01 --trials 8", expect_key: "mr_variant", expect_window: "2024-01-01"}
          - {name: backtest_mr_k5, flags: "--mean-rev-sharp --slots 5 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_k6, flags: "--mean-rev-sharp --slots 6 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_k7, flags: "--mean-rev-sharp --slots 7 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_k8, flags: "--mean-rev-sharp --slots 8 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_dyn, flags: "--mean-rev-sharp --dyn-floor 4 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_cash, flags: "--mean-rev-sharp --slots 5 --cash-yield 0.05 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_t4, flags: "--mean-rev-sharp --take 4 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_t5, flags: "--mean-rev-sharp --take 5 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_t3h7, flags: "--mean-rev-sharp --take 3 --hold 7 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_t4h7, flags: "--mean-rev-sharp --take 4 --hold 7 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_trail, flags: "--mean-rev-sharp --take 999 --trail 2 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_flat3, flags: "--mean-rev-sharp --take 999 --hold 3 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_d4, flags: "--mean-rev-sharp --slots 7 --take 3.5 --drop 4 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_d6, flags: "--mean-rev-sharp --slots 7 --take 3.5 --drop 6 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_d7, flags: "--mean-rev-sharp --slots 7 --take 3.5 --drop 7 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_dd2, flags: "--mean-rev-sharp --slots 7 --take 3.5 --drop 5 --drop-days 2 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_s6, flags: "--mean-rev-sharp --slots 7 --take 3.5 --stop 6 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_s7, flags: "--mean-rev-sharp --slots 7 --take 3.5 --stop 7 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_s10, flags: "--mean-rev-sharp --slots 7 --take 3.5 --stop 10 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_atr, flags: "--mean-rev-sharp --slots 7 --take 3.5 --atr-stop 2 --trials 28", expect_key: "mr_variant", expect_window: ""}
          - {name: backtest_mr_c1, flags: "--mean-rev-sharp --take 3 --hold 7 --trials 31 --start 2015-01-01 --end 2021-01-01", expect_key: "mr_variant", expect_window: "2015-01-01"}
          - {name: backtest_mr_c2, flags: "--mean-rev-sharp --slots 7 --take 3.5 --drop 6 --trials 31 --start 2015-01-01 --end 2021-01-01", expect_key: "mr_variant", expect_window: "2015-01-01"}
          - {name: backtest_mr_c3, flags: "--mean-rev-sharp --slots 7 --drop 6 --take 3.5 --hold 7 --stop 6 --trials 31 --start 2015-01-01 --end 2021-01-01", expect_key: "mr_variant", expect_window: "2015-01-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: |
          git clone --depth 1 "https://x-access-token:${BRAIN_PAT}@github.com/doishy-doish/bot-paper-brain.git" /tmp/brain
        env:
          BRAIN_PAT: ${{ secrets.BRAIN_PAT }}
      - run: python /tmp/brain/scripts/backtest.py --quiet ${{ matrix.flags }} --out /tmp/${{ matrix.name }}.json
      - run: |
          rm -rf /tmp/brain
          rm -f results_trades.csv
      - run: |
          node -e '
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync(process.env.OUT_FILE, "utf8"));
          if (!s.trades) throw new Error("STALE/EMPTY: no trades in " + process.env.OUT_FILE);
          if (process.env.EXPECT_KEY && !s[process.env.EXPECT_KEY]) throw new Error("STALE BRAIN COPY: expected truthy " + process.env.EXPECT_KEY + " (sync brain scripts/backtest.py from src/bot/backtest.py)");
          if (process.env.EXPECT_WINDOW && ((s.window || {}).start !== process.env.EXPECT_WINDOW)) throw new Error("STALE BRAIN COPY: window mismatch in " + process.env.OUT_FILE + " (sync brain scripts/backtest.py)");
          console.log("guard ok: " + process.env.OUT_FILE + " trades=" + s.trades);
          '
        env:
          OUT_FILE: /tmp/${{ matrix.name }}.json
          EXPECT_KEY: ${{ matrix.expect_key }}
          EXPECT_WINDOW: ${{ matrix.expect_window }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.json
          if-no-files-found: error
  collect:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: "backtest*"
      - run: |
          mkdir -p data
          for f in artifacts/*/*.json; do cp "$f" "data/$(basename $f)"; done
          ls data/
      - run: node scripts/scramble.mjs encrypt data/backtest.json data/backtest_null.json data/backtest_nifty.json data/backtest_vol.json data/backtest_mom.json data/backtest_mr.json data/backtest_mr_sharp.json data/backtest_valid.json data/backtest_mr_sharp_valid.json data/backtest_mr_k5.json data/backtest_mr_k6.json data/backtest_mr_k7.json data/backtest_mr_k8.json data/backtest_mr_dyn.json data/backtest_mr_cash.json data/backtest_mr_t4.json data/backtest_mr_t5.json data/backtest_mr_t3h7.json data/backtest_mr_t4h7.json data/backtest_mr_trail.json data/backtest_mr_flat3.json data/backtest_mr_d4.json data/backtest_mr_d6.json data/backtest_mr_d7.json data/backtest_mr_dd2.json data/backtest_mr_s6.json data/backtest_mr_s7.json data/backtest_mr_s10.json data/backtest_mr_atr.json data/backtest_mr_c1.json data/backtest_mr_c2.json data/backtest_mr_c3.json
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
      - run: |
          git config user.name "paper-tick"
          git config user.email "paper-tick@users.noreply.github.com"
          git add data/backtest.json data/backtest_null.json data/backtest_nifty.json data/backtest_vol.json data/backtest_mom.json data/backtest_mr.json data/backtest_mr_sharp.json data/backtest_valid.json data/backtest_mr_sharp_valid.json data/backtest_mr_k5.json data/backtest_mr_k6.json data/backtest_mr_k7.json data/backtest_mr_k8.json data/backtest_mr_dyn.json data/backtest_mr_cash.json data/backtest_mr_t4.json data/backtest_mr_t5.json data/backtest_mr_t3h7.json data/backtest_mr_t4h7.json data/backtest_mr_trail.json data/backtest_mr_flat3.json data/backtest_mr_d4.json data/backtest_mr_d6.json data/backtest_mr_d7.json data/backtest_mr_dd2.json data/backtest_mr_s6.json data/backtest_mr_s7.json data/backtest_mr_s10.json data/backtest_mr_atr.json data/backtest_mr_c1.json data/backtest_mr_c2.json data/backtest_mr_c3.json
          git diff --cached --quiet || git commit -m "backtest $(date -u +%F)"
          git pull --rebase
          git push
