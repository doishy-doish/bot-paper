name: backtest
# Scrambled: public runner computes, but data/*.json are AES-256-GCM ciphertext.
# Decrypt on our side after pull (see SCRAMBLE.md). Triggers stay
# schedule/dispatch ONLY — never add pull_request (that would expose
# BRAIN_PAT / SCRAMBLE_KEY to forked runs).
on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: |
          git clone --depth 1 "https://x-access-token:${BRAIN_PAT}@github.com/doishy-doish/bot-paper-brain.git" /tmp/brain
        env:
          BRAIN_PAT: ${{ secrets.BRAIN_PAT }}
      - run: |
          mkdir -p data
          python /tmp/brain/scripts/backtest.py --quiet --null --out data/backtest_null.json
          python /tmp/brain/scripts/backtest.py --quiet --out data/backtest.json
          python /tmp/brain/scripts/backtest.py --quiet --nifty-filter --out data/backtest_nifty.json
          rm -rf /tmp/brain
          rm -f results_trades.csv
      - run: |
          node -e '
          const fs = require("fs");
          for (const f of ["data/backtest.json", "data/backtest_null.json", "data/backtest_nifty.json"]) {
            if (!fs.existsSync(f)) throw new Error("missing " + f);
          }
          const n = JSON.parse(fs.readFileSync("data/backtest_nifty.json", "utf8"));
          if (!n.nifty_filter) throw new Error("STALE BRAIN COPY: backtest.py ignored --nifty-filter (sync brain scripts/backtest.py from src/bot/backtest.py)");
          console.log("guard ok: nifty_filter=true, trades=" + n.trades);
          '
      - run: node scripts/scramble.mjs encrypt data/backtest.json data/backtest_null.json data/backtest_nifty.json
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE_KEY }}
      - run: |
          git config user.name "paper-tick"
          git config user.email "paper-tick@users.noreply.github.com"
          git add data/backtest.json data/backtest_null.json data/backtest_nifty.json
          git diff --cached --quiet || git commit -m "backtest $(date -u +%F)"
          git push
