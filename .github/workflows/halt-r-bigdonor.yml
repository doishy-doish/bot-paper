name: halt-r-bigdonor
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-bigdonor.yml'
permissions:
  contents: write
jobs:
  bench:
    name: bigdonor ${{ matrix.corpus }} ${{ matrix.arm }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - corpus: revbal
            arm: sup
            flags: "--proj sup --mix none"
          - corpus: revbal
            arm: tiny
            flags: "--proj graft5 --anchors 256 --graftgguf halt-r/tinygpt-arith-revbal.gguf --mix none"
          - corpus: revbal
            arm: q05
            flags: "--proj graft5 --anchors 256 --graftemb hf,Qwen/Qwen2.5-0.5B-Instruct,model.safetensors --mix none"
          - corpus: revbal
            arm: q15
            flags: "--proj graft5 --anchors 256 --graftemb hf,Qwen/Qwen2.5-1.5B-Instruct,model.safetensors --mix none"
          - corpus: ts
            arm: sup
            flags: "--proj sup --mix none"
          - corpus: ts
            arm: q05
            flags: "--proj graft5 --anchors 256 --graftemb hf,Qwen/Qwen2.5-0.5B-Instruct,model.safetensors --mix none"
          - corpus: ts
            arm: q15
            flags: "--proj graft5 --anchors 256 --graftemb hf,Qwen/Qwen2.5-1.5B-Instruct,model.safetensors --mix none"
          - corpus: shakes
            arm: sup
            flags: "--proj sup --mix none"
          - corpus: shakes
            arm: q05
            flags: "--proj graft5 --anchors 256 --graftemb hf,Qwen/Qwen2.5-0.5B-Instruct,model.safetensors --mix none"
          - corpus: shakes
            arm: q15
            flags: "--proj graft5 --anchors 256 --graftemb hf,Qwen/Qwen2.5-1.5B-Instruct,model.safetensors --mix none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (fail loud, size floor)
        run: |
          if [ "${{ matrix.corpus }}" = revbal ]; then
            python3 halt-r/make-arith-revbal.py --out /tmp/arith --W 16
            cp /tmp/arith/arith-full.txt /tmp/corpus.txt
            FLOOR=50000
          else
            FLOOR=100000
          fi
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL --fail -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          elif [ "${{ matrix.corpus }}" != revbal ]; then
            curl -sSL --fail https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          [ $(wc -c < /tmp/corpus.txt) -gt $FLOOR ] || (echo "FAIL corpus too small"; exit 1)
          wc -c /tmp/corpus.txt
      - name: bench transplant cell (frozen donor rows, K=256 floor)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: |
          node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/bigdonor-${{ matrix.corpus }}-${{ matrix.arm }} --tag bigdonor-${{ matrix.corpus }} --W 16 --P 8000 --trials 200 --H 256 --no-gen --split 1 --hedge 1 ${{ matrix.flags }} 2>&1 | tee /tmp/bench-${{ matrix.corpus }}-${{ matrix.arm }}.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigdonor-${{ matrix.corpus }}-${{ matrix.arm }}
          path: out/bigdonor-${{ matrix.corpus }}-${{ matrix.arm }}/metrics.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bigdonor-benchlog-${{ matrix.corpus }}-${{ matrix.arm }}
          path: /tmp/bench-${{ matrix.corpus }}-${{ matrix.arm }}.log
          retention-days: 7
  alone:
    name: alone ${{ matrix.donor }} ${{ matrix.corpus }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - donor: q05
            corpus: revbal
            gguf: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          - donor: q15
            corpus: revbal
            gguf: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          - donor: q05
            corpus: ts
            gguf: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          - donor: q15
            corpus: ts
            gguf: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          - donor: q05
            corpus: shakes
            gguf: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          - donor: q15
            corpus: shakes
            gguf: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: fetch corpus (fail loud, size floor)
        run: |
          if [ "${{ matrix.corpus }}" = revbal ]; then
            python3 halt-r/make-arith-revbal.py --out /tmp/arith --W 16
            cp /tmp/arith/arith-full.txt /tmp/corpus.txt
            FLOOR=50000
          else
            FLOOR=100000
          fi
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL --fail -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          elif [ "${{ matrix.corpus }}" != revbal ]; then
            curl -sSL --fail https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          [ $(wc -c < /tmp/corpus.txt) -gt $FLOOR ] || (echo "FAIL corpus too small"; exit 1)
      - name: build llama.cpp server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake > /dev/null 2>&1 || true
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release > /tmp/cmake.log 2>&1 || (tail -30 /tmp/cmake.log; exit 1)
          cmake --build /tmp/llama.cpp/build --config Release -j4 > /tmp/build.log 2>&1 || (tail -30 /tmp/build.log; exit 1)
          ls /tmp/llama.cpp/build/bin/llama-server
      - name: fetch donor GGUF (fail loud)
        run: |
          curl -sSL --fail "${{ matrix.gguf }}" -o /tmp/donor.gguf
          [ $(wc -c < /tmp/donor.gguf) -gt 100000000 ] || (echo "FAIL donor too small"; exit 1)
      - name: start server
        run: |
          /tmp/llama.cpp/build/bin/llama-server -m /tmp/donor.gguf --port 8080 --ctx-size 64 > /tmp/server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health && break || sleep 5; done
          curl -sf http://127.0.0.1:8080/health
      - name: donor-alone queries (report stream, diagnostic-grade)
        run: |
          echo "--- smoke: raw /completion shape for one probe (self-identifies HEAD API drift) ---"
          curl -sS -m 60 http://127.0.0.1:8080/completion -H 'Content-Type: application/json' -d '{"prompt":"ab","n_predict":1,"n_probs":100,"temperature":0,"cache_prompt":true,"post_sampling_probs":true}' -o /tmp/smoke.json
          node -e "const r=require('/tmp/smoke.json'); const cp0=r.completion_probabilities&&r.completion_probabilities[0]; const p=(cp0&&(cp0.probs||cp0.top_probs))||[]; if(!p.length){console.error('SMOKE FAIL: no probs keys='+Object.keys(r).join(','), JSON.stringify(r).slice(0,400)); process.exit(1)}; console.log('smoke ok probs='+p.length)"
          echo ""
          echo "--- end smoke ---"
          node halt-r/qwen-alone.mjs --server http://127.0.0.1:8080 --data /tmp/corpus.txt --W 16 --trials 200 --seed 2001 --donor ${{ matrix.donor }} --corpus ${{ matrix.corpus }} --out out/alone-${{ matrix.donor }}-${{ matrix.corpus }}/alone.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigdonor-alone-${{ matrix.donor }}-${{ matrix.corpus }}
          path: out/alone-${{ matrix.donor }}-${{ matrix.corpus }}/alone.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bigdonor-serverlog-${{ matrix.donor }}-${{ matrix.corpus }}
          path: /tmp/server.log
          retention-days: 7
  collect:
    name: collect bigdonor verdict
    needs: [bench, alone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bigdonor-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: bigdonor verdict (continuity slope + transfer cells)
        run: |
          node - <<'EOF' | tee /tmp/bigdonor.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json' || e.name === 'alone.json') files.push(p); } };
          walk('models');
          const bench = [], alone = [];
          for (const f of files){
            const m = JSON.parse(fs.readFileSync(f, 'utf8')); m._f = f;
            if (f.endsWith('metrics.json')){
              const dm = f.match(/bigdonor-(revbal|ts|shakes)-(sup|tiny|q05|q15)/);
              if (!dm) { console.log('FAIL unexpected bench artifact ' + f); process.exit(1); }
              bench.push({corpus: dm[1], arm: dm[2], m});
            } else alone.push(m);
          }
          const need = [['revbal','sup'],['revbal','tiny'],['revbal','q05'],['revbal','q15'],['ts','sup'],['ts','q05'],['ts','q15'],['shakes','sup'],['shakes','q05'],['shakes','q15']];
          for (const [c, a] of need) if (!bench.find(r => r.corpus === c && r.arm === a)){ console.log('FAIL missing bench arm ' + c + ' ' + a); process.exit(1); }
          if (alone.length < 6) { console.log('FAIL missing alone arms (' + alone.length + '/6)'); process.exit(1); }
          const cell = (corpus, arm) => bench.find(r => r.corpus === corpus && r.arm === arm).m;
          let md = '# BIGDONOR: frozen-Qwen graft matrix (measured, CI)\nrevbal/shakes/ts W16, P=8000, T200 same seeds, graft5-K256 (floor), donor rows via safetensors ranges (exact tok rows, zero training, zero full download).\n\n| corpus | arm | interp acc/ppl (lam*) | graftSpec |\n|---|---|---|---|\n';
          for (const r of bench) md += '| ' + r.corpus + ' | ' + r.arm + ' | ' + r.m.interpAcc.toFixed(3) + '/' + r.m.interpPpl.toFixed(2) + ' (' + r.m.interpLambda + ') | ' + (r.m.graftSpec || (r.m.graftFile || '-')) + ' |\n';
          md += '\n| donor | corpus | alone acc/ppl (coverage) |\n|---|---|---|\n';
          for (const a of alone) md += '| ' + a.donor + ' | ' + a.corpus + ' | ' + a.acc.toFixed(3) + '/' + a.ppl.toFixed(2) + ' (' + a.coverage.toFixed(3) + ') |\n';
          const verdicts = [];
          for (const corpus of ['revbal', 'shakes', 'ts']){
            const sup = cell(corpus, 'sup');
            for (const arm of ['tiny', 'q05', 'q15']){
              const b = bench.find(r => r.corpus === corpus && r.arm === arm);
              if (!b) continue;
              const g = b.m, d = sup.interpPpl - g.interpPpl;
              const pm = pair(g.repHitI || '', sup.repHitI || '');
              const wins = g.interpLambda > 0 && d > 0.2 && pm.p < 0.05;
              verdicts.push({corpus, arm, d, pm, wins});
              md += '\n' + corpus + ' ' + arm + ': sup ' + sup.interpPpl.toFixed(2) + ' vs graft ' + g.interpPpl.toFixed(2) + ' d=' + d.toFixed(2) + ' b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(4) + (wins ? ' HOLDS.' : ' falls.') + '\n';
            }
          }
          // continuity selection: FIRST corpus with strict donor-alone ordering q15 > q05
          const al = (donor, corpus) => alone.find(a => a.donor === donor && a.corpus === corpus);
          let contCorpus = null;
          for (const c of ['revbal', 'shakes', 'ts']){
            const a05 = al('q05', c), a15 = al('q15', c);
            if (a05 && a15 && a15.acc > a05.acc){ contCorpus = c; break; }
          }
          const dd = {};
          if (contCorpus){
            for (const arm of ['q05', 'q15']) dd[arm] = cell(contCorpus, 'sup').interpPpl - cell(contCorpus, arm).interpPpl;
          }
          const slopeFires = contCorpus !== null && dd.q15 > dd.q05;
          md += '\nCONTINUITY: corpus=' + (contCorpus || 'NONE (no strict q15>q05 ordering anywhere \u2014 continuity VOID)') + (contCorpus ? ' d05=' + dd.q05.toFixed(2) + ' d15=' + dd.q15.toFixed(2) : '') + ' \u2192 7B ' + (slopeFires ? 'FIRES (strict slope; next build on user call).' : 'does NOT fire.') + '\n';
          md += '\nTRANSFER (ts, donor-known control): read descriptively against the confound note; C1 arXiv-unknown fallback staged if ts is uninformative either way.\n';
          process.stdout.write(md);
          fs.writeFileSync('/tmp/bigdonor.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'bigdonor-graft-matrix', preReg: 'scratch/papers/bigdonor-prereg-2026-11-15.md + slope/selection addendum: continuity corpus = first of [revbal,shakes,ts] with strict donor-alone q15>q05; 7B fires iff graft-d strictly increasing there; tiny = heterogeneity reference only.', verdicts, alone: alone.map(a => ({donor: a.donor, corpus: a.corpus, acc: a.acc, ppl: a.ppl, coverage: a.coverage})), contCorpus, slopeFires}, null, 1));
          EOF
      - name: commit bigdonor back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bigdonor.json halt-r/bigdonor.json
            cp /tmp/bigdonor.md halt-r/bigdonor.md
            git add halt-r/bigdonor.json halt-r/bigdonor.md .github/workflows/halt-r-bigdonor.yml
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: bigdonor verdict $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
