name: halt-r-h9
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-h9.yml'
permissions:
  contents: write
jobs:
  bench:
    name: h9 ${{ matrix.corpus }} W${{ matrix.W }} pk${{ matrix.pk }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        pk: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: bench h9 arm (JS-only, same code path)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/h9-${{ matrix.corpus }}-W${{ matrix.W }}-pk${{ matrix.pk }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj sup --H 256 --sparse 0 --hedge 0 --pk ${{ matrix.pk }} --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: h9-${{ matrix.corpus }}-W${{ matrix.W }}-pk${{ matrix.pk }}
          path: out/h9-${{ matrix.corpus }}-W${{ matrix.W }}-pk${{ matrix.pk }}/
          retention-days: 30
  collect:
    name: collect h9 verdicts
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: h9-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: h9 leaders-index parity + cost verdicts (paired McNemar)
        run: |
          node - <<'EOF' | tee /tmp/h9.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
           let pk = Math.pow(0.5, n), tail = pk;
           for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
           return Math.min(1, 2 * tail); };
           const pair = (s1, s2) => { let b = 0, c = 0;
           for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
           if (a === 'x' || d === 'x') continue;
           if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
           return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || (a.pk || 0) - (b.pk || 0));
          fs.writeFileSync('/tmp/h9.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'h9-leaders', runs}, null, 1));
          let md = "# H9: leaders-index vs dense scan (measured, CI)\nSame protocol (P=8000, sup, no-gen). pk=1 routes via 256 leaders + top-2 member rerank (sublinear eval). Parity on interp + measured MACs.\n\n| corpus | W | pk | cost | interp acc/ppl (lam*) | evalMflops | pkMflops |\n|---|---|---|---|---|---|---|\n";
          for (const r of runs) md += '| ' + r.corpus + ' | ' + r.W + ' | ' + r.pk + ' | ' + (r.costClass || '?') + ' | ' + r.interpAcc.toFixed(3) + '/' + r.interpPpl.toFixed(2) + ' (' + r.interpLambda + ') | ' + r.evalMflops + ' | ' + r.pkMflops + ' |\n';
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
           const s0 = runs.find(r => r.corpus === corpus && r.W === W && r.pk === 0);
           const s1 = runs.find(r => r.corpus === corpus && r.W === W && r.pk === 1);
           if (!s0 || !s1) continue;
           const pm = pair(s1.repHitI || '', s0.repHitI || '');
           const ratio = s0.evalMflops > 0 ? (s0.evalMflops / Math.max(0.1, s1.pkMflops)).toFixed(1) : '?';
           md += '\n' + corpus + ' W' + W + ' dense ' + s0.interpPpl.toFixed(2) + ' -> pk ' + s1.interpPpl.toFixed(2) + ' McNemar b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + ' eval ' + ratio + 'x cheaper.' + ' ' + (Math.abs(s1.interpPpl - s0.interpPpl) / s0.interpPpl < 0.05 ? 'VERDICT: PARITY (sublinear stands).' : s1.interpPpl < s0.interpPpl ? 'VERDICT: PK WINS.' : 'VERDICT: PK FAILS.') + '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/h9.json halt-r/h9.json
          cp /tmp/h9.md halt-r/h9.md
          cat halt-r/h9.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit h9 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/h9.json halt-r/h9.json
            git add halt-r/h9.json halt-r/h9.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: h9 leaders $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
