name: halt-r-sup2
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-sup2.yml'
permissions:
  contents: write
jobs:
  bench:
    name: sup2 ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.proj }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        proj: [sup, sup2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          head -c 200 /tmp/corpus.txt
      - name: bench per-pos vs per-pos-char scales
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/sup2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj ${{ matrix.proj }} --H 256 --ada 0 --score whole --capab none --h6 0 --split 1 --pen 0 --prov 0 --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: sup2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}
          path: out/sup2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}/
          retention-days: 30
  collect:
    name: collect sup2 verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sup2-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: sup2 table plus verdict
        run: |
          node - <<'EOF' | tee /tmp/sup2.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          try { walk('models'); } catch (e) { console.log('no metrics found'); process.exit(0); }
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || (a.proj < b.proj ? -1 : 1));
          fs.writeFileSync('/tmp/sup2.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'sup2-poschar-scales', runs}, null, 1));
          let md = '# sup2: per-(position,char) scales vs per-position scales\nSame protocol (P=8000, H=256, fixed lam, no-gen). sup2 = W*V predictive scales (strict generalization of sup). C5 split rides along (descriptive).\n\n| corpus | W | proj | hop acc/ppl | interp acc/ppl (lam*) | mem acc/n | nov acc/n |\n|---|---|---|---|---|---|\n';
          for (const m of runs) {
            const sp = (m.memN === undefined) ? '-/-' : (m.memAcc.toFixed(2) + '/' + m.memN + ' vs ' + m.novAcc.toFixed(2) + '/' + m.novN);
            md += '| ' + m.corpus + ' | ' + m.W + ' | ' + m.proj + ' | ' + m.acc.toFixed(3) + '/' + m.ppl.toFixed(2) + ' | ' + m.interpAcc.toFixed(3) + '/' + m.interpPpl.toFixed(2) + ' (' + m.interpLambda + ') | ' + sp + ' |\n';
          }
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const g = runs.filter(m => m.corpus === corpus && m.W === W);
            if (g.length < 2) continue;
            const f = g.find(m => m.proj === 'sup'), b = g.find(m => m.proj === 'sup2');
            if (!f || !b) continue;
            const d = f.interpPpl - b.interpPpl;
            md += '\n' + corpus + ' W' + W + ': sup interpPpl=' + f.interpPpl.toFixed(2) + ' vs sup2 interpPpl=' + b.interpPpl.toFixed(2) + ' d=' + d.toFixed(2) + '. ';
            md += (d > 0 ? 'VERDICT: SCALES-REFINE WINS.' : 'VERDICT: sup HOLDS (finer scales add nothing).');
            if (b.memN !== undefined) md += ' Memorized ' + b.memAcc.toFixed(2) + ' (n=' + b.memN + ') vs novel ' + b.novAcc.toFixed(2) + ' (n=' + b.novN + ').';
            md += '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/sup2.json halt-r/sup2.json
          cp /tmp/sup2.md halt-r/sup2.md
          cat halt-r/sup2.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit sup2 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sup2.json halt-r/sup2.json
            cp /tmp/sup2.md halt-r/sup2.md
            git add halt-r/sup2.json halt-r/sup2.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: sup2 poschar-scales $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
