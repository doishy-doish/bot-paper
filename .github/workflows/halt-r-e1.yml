name: halt-r-e1
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-e1.yml'
permissions:
  contents: write
jobs:
  bench:
    name: e1 ${{ matrix.corpus }} W${{ matrix.W }} T${{ matrix.smp }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        smp: [0, 0.7, 1.0, 1.3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          head -c 200 /tmp/corpus.txt
      - name: bench energy sampling
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/e1-${{ matrix.corpus }}-W${{ matrix.W }}-t${{ matrix.smp }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj sup --H 256 --ada 0 --score whole --capab none --h6 0 --split 0 --pen 0 --prov 0 --dtw 0 --smp ${{ matrix.smp }}
      - uses: actions/upload-artifact@v4
        with:
          name: e1-${{ matrix.corpus }}-W${{ matrix.W }}-t${{ matrix.smp }}
          path: out/e1-${{ matrix.corpus }}-W${{ matrix.W }}-t${{ matrix.smp }}/
          retention-days: 30
  collect:
    name: collect e1 verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e1-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: e1 table plus verdict
        run: |
          node - <<'EOF' | tee /tmp/e1.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          try { walk('models'); } catch (e) { console.log('no metrics found'); process.exit(0); }
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || a.smp - b.smp);
          fs.writeFileSync('/tmp/e1.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'e1-energy-sampling', preReg: 'min-T rep4 < 0.3 held-out AND wordValid within 0.1 of smp=0 control AND interpPpl still beats bigram', runs}, null, 1));
          let md = '# E1: energy sampling vs argmax lock\nSame protocol (P=8000, sup, W8/W16, gen ON). Sample with temperature T on the hop dist (dedicated stream 3002). Pre-reg: rep4 < 0.3 held-out, wordValid held, ppl still beats bigram.\n\n| corpus | W | T | rep4 | wordValid | interpPpl | bigramPpl |\n|---|---|---|---|---|---|---|\n';
          for (const m of runs) {
            md += '| ' + m.corpus + ' | ' + m.W + ' | ' + m.smp + ' | ' + m.quality.rep4.toFixed(3) + ' | ' + m.quality.wordValid.toFixed(3) + ' | ' + m.interpPpl.toFixed(2) + ' | ' + m.bigramPpl.toFixed(2) + ' |\n';
          }
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const g = runs.filter(m => m.corpus === corpus && m.W === W);
            const f = g.find(m => m.smp === 0);
            const rest = g.filter(m => m.smp !== 0);
            if (!f || !rest.length) { md += '\n' + corpus + ' W' + W + ': INCOMPLETE (missing control or grid).\n'; continue; }
            const ok = r => r.quality.rep4 < 0.3 && Math.abs(r.quality.wordValid - f.quality.wordValid) <= 0.1 && r.interpPpl < r.bigramPpl;
            const win = rest.filter(ok).sort((x, y) => x.quality.rep4 - y.quality.rep4);
            md += '\n' + corpus + ' W' + W + ': argmax rep4=' + f.quality.rep4.toFixed(3) + ' wordValid=' + f.quality.wordValid.toFixed(3) + '. ';
            md += win.length ? ('VERDICT: SAMPLING MOVES (T=' + win[0].smp + ' rep4=' + win[0].quality.rep4.toFixed(3) + ' wordValid=' + win[0].quality.wordValid.toFixed(3) + ').') : 'VERDICT: SAMPLING HOLDS (lock is distributional, not argmax-greedy).';
            md += '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/e1.json halt-r/e1.json
          cp /tmp/e1.md halt-r/e1.md
          cat halt-r/e1.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit e1 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/e1.json halt-r/e1.json
            cp /tmp/e1.md halt-r/e1.md
            git add halt-r/e1.json halt-r/e1.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: e1 energy-sampling $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
