name: halt-r-h12
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'halt-r/lm-shakespeare.mjs'
      - '.github/workflows/halt-r-h12.yml'
permissions:
  contents: write
jobs:
  bench:
    name: h12 ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.proj }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [4, 8]
        proj: [raw, sim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: bench BPE pilot (256 merges, JS-only, zero new deps)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/h12-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj ${{ matrix.proj }} --H 256 --tok bpe --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: h12-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}
          path: out/h12-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}/
          retention-days: 30
  collect:
    name: collect BPE verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: h12-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: subword verdict (internal lam*, no cross-tokenizer BPC claims)
        run: |
          node - <<'EOF' | tee /tmp/h12.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || (a.proj < b.proj ? -1 : 1));
          fs.writeFileSync('/tmp/h12.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'h12-bpe-pilot', runs}, null, 1));
          let md = '# H12: BPE subword pilot (measured, CI)\n256 merges, JS-only. Verdict is INTERNAL (lam* + interp vs base under the SAME tokenizer) — id-level ppl is not comparable across tokenizers, so no BPC claims here.\n\n| corpus | W | proj | cost | V | tokLen | base acc/ppl | interp acc/ppl (lam*) |\n|---|---|---|---|---|---|---|---|\n';
          for (const r of runs) md += '| ' + r.corpus + ' | ' + r.W + ' | ' + r.proj + ' | ' + (r.costClass || 'linear-O(P·D)') + ' | ' + r.V + ' | ' + r.bpeMeanLen.toFixed(2) + ' | ' + r.bigramAcc.toFixed(3) + '/' + r.bigramPpl.toFixed(2) + ' | ' + r.interpAcc.toFixed(3) + '/' + r.interpPpl.toFixed(2) + ' (' + r.interpLambda + ') |\n';
          for (const r of runs) {
            md += '\n' + r.corpus + ' W' + r.W + ' ' + r.proj + ': ' + (r.interpLambda > 0 && r.interpPpl < r.bigramPpl ? 'VERDICT: SUBWORD MOVES (lam*=' + r.interpLambda + ').' : 'VERDICT: WALL STANDS across tokenizers (lam*=' + r.interpLambda + ').') + '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/h12.json halt-r/h12.json
          cp /tmp/h12.md halt-r/h12.md
          cat halt-r/h12.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit h12 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/h12.json halt-r/h12.json
            cp /tmp/h12.md halt-r/h12.md
            git add halt-r/h12.json halt-r/h12.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: h12 bpe-pilot $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
