name: confidence-audit
# Runs tools/confidence-audit.py (stdlib only, zero GPU) over the banked
# run tables + 44 raw traces, and commits the verdict back to evidence/.
# Triggers stay schedule/dispatch ONLY — never add pull_request.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p evidence
          OUT="evidence/confidence-audit-${{ github.run_id }}.txt"
          python3 tools/confidence-audit.py \
            --pool tools/data/fire-w1-table.json:tools/traces/w1 \
            --pool tools/data/fire-w2a-table.json:tools/traces/w2a \
            --pool tools/data/fire-fam-table.json:tools/traces/fam \
            --out evidence/confidence-audit-results.json > "$OUT" 2>&1
          echo "exit=$? python=$(python3 --version 2>&1)" >> "$OUT"
          git config user.name "audit-run"
          git config user.email "audit-run@users.noreply.github.com"
          git add "$OUT" evidence/confidence-audit-results.json
          git diff --cached --quiet || git commit -m "confidence-audit run ${{ github.run_id }}"
          git pull --rebase
          git push
