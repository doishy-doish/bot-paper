name: halt-r-h2
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-h2.yml'
permissions:
  contents: write
jobs:
  bench:
    name: h2 ${{ matrix.corpus }} W${{ matrix.W }} beta-${{ matrix.betaSel }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        betaSel: [acc, ppl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          head -c 200 /tmp/corpus.txt
      - name: bench beta selection ablation
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/h2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.betaSel }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj sup --H 256 --betaSel ${{ matrix.betaSel }} --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: h2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.betaSel }}
          path: out/h2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.betaSel }}/
          retention-days: 30
  collect:
    name: collect h2 beta objective ablation
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: h2-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: beta objective table plus verdict
        run: |
          node - <<'EOF' | tee /tmp/h2.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          try { walk('models'); } catch (e) { console.log('no metrics found'); process.exit(0); }
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || (a.betaSel < b.betaSel ? -1 : 1));
          fs.writeFileSync('/tmp/h2.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'h2-beta-objective', runs}, null, 1));
          let md = '# H2: ppl-tuned beta vs acc-tuned beta under sup\nSame protocol as H1 (P=8000, H=256, no-gen, sup only). Tests whether the calibration gap closes when beta is tuned for ppl.\n\n| corpus | W | betaSel | used beta | interp acc/ppl (lam*) | hop acc/ppl | bigram acc/ppl |\n|---|---|---|---|---|---|---|\n';
          for (const m of runs) md += '| ' + m.corpus + ' | ' + m.W + ' | ' + m.betaSel + ' | ' + m.beta + ' | ' + m.interpAcc.toFixed(3) + '/' + m.interpPpl.toFixed(2) + ' (' + m.interpLambda + ') | ' + m.acc.toFixed(3) + '/' + m.ppl.toFixed(2) + ' | ' + m.bigramAcc.toFixed(3) + '/' + m.bigramPpl.toFixed(2) + ' |\n';
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const g = runs.filter(m => m.corpus === corpus && m.W === W);
            if (g.length < 2) continue;
            const a = g.find(m => m.betaSel === 'acc'), p = g.find(m => m.betaSel === 'ppl');
            md += '\n' + corpus + ' W' + W + ': acc-beta interpPpl=' + a.interpPpl.toFixed(2) + ' vs ppl-beta interpPpl=' + p.interpPpl.toFixed(2) + ' (bigram ' + a.bigramPpl.toFixed(2) + '). ';
            md += (p.interpPpl < a.interpPpl) ? 'VERDICT: H2 HOLDS (ppl-tuned beta wins).' : 'VERDICT: H2 FAILS (acc-tuned beta still wins).';
            md += '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/h2.json halt-r/h2.json
          cp /tmp/h2.md halt-r/h2.md
          cat halt-r/h2.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit h2 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/h2.json halt-r/h2.json
            cp /tmp/h2.md halt-r/h2.md
            git add halt-r/h2.json halt-r/h2.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: h2 beta-objective $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
