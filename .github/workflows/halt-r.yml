name: halt-r verify
on:
  push:
    paths:
      - 'halt-r/**'
      - '.github/workflows/halt-r.yml'
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest  # public runner, CPU only, no secrets, no private compute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --version && node halt-r/verify.mjs
