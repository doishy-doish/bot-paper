name: halt-r-enc2
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-enc2.yml'
permissions:
  contents: write
jobs:
  bench:
    name: enc2 ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.proj }} ${{ matrix.tok }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        proj: [sup, enc2]
        tok: [char, bpe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: bench trunk v2 (supervised probe encoder vs sup control, JS-only)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/enc2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}-${{ matrix.tok }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj ${{ matrix.proj }} --tok ${{ matrix.tok }} --H 256 --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: enc2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}-${{ matrix.tok }}
          path: out/enc2-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}-${{ matrix.tok }}/
          retention-days: 30
  collect:
    name: collect trunk v2 verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: enc2-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: encoder-v2-vs-scales verdict
        run: |
          node - <<'EOF' | tee /tmp/enc2.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || (a.tok < b.tok ? -1 : 1) || (a.proj < b.proj ? -1 : 1));
          fs.writeFileSync('/tmp/enc2.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'enc2-trunk', runs}, null, 1));
          let md = '# H-enc2: supervised-probe encoder vs sup scales (measured, CI)\nSame protocol (P=8000, H=256, no-gen). enc2: 300 SGD steps, batch 128, CE linear probe (JS-only, zero python), probe discarded, M kept, sign bits via identical featPM path. sup rows are same-workflow controls. Bar: 0.2 ppl + McNemar p<0.05. Cost: both linear-O(P·D); sublinear is H9.\n\n| corpus | W | tok | proj | cost | encLoss first->last | interp acc/ppl (lam*) |\n|---|---|---|---|---|---|---|\n';
          for (const r of runs) md += '| ' + r.corpus + ' | ' + r.W + ' | ' + r.tok + ' | ' + r.proj + ' | ' + (r.costClass || 'linear-O(P·D)') + ' | ' + r.encLossFirst.toFixed(3) + '->' + r.encLossLast.toFixed(3) + ' | ' + r.interpAcc.toFixed(3) + '/' + r.interpPpl.toFixed(2) + ' (' + r.interpLambda + ') |\n';
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) for (const tok of ['char', 'bpe']) {
            const s = runs.find(r => r.corpus === corpus && r.W === W && r.proj === 'sup' && r.tok === tok);
            const e = runs.find(r => r.corpus === corpus && r.W === W && r.proj === 'enc2' && r.tok === tok);
            if (!s || !e) continue;
            const d = s.interpPpl - e.interpPpl;
            const wins = e.interpLambda > 0 && d > 0.2;
            const pm = pair(e.repHitI || '', s.repHitI || '');
            md += '\n' + corpus + ' W' + W + ' ' + tok + ': sup ' + s.interpPpl.toFixed(2) + ' vs enc2 ' + e.interpPpl.toFixed(2) + ' (lam*=' + e.interpLambda + ', d=' + d.toFixed(2) + '). McNemar enc2-vs-sup b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + (pm.p < 0.05 ? ' SIGNIFICANT.' : '.') + ' ' + (wins && pm.p < 0.05 ? 'VERDICT: ENC2 CRACKS IT.' : wins ? 'VERDICT: leans enc2, not significant.' : d > 0 ? 'VERDICT: under bar (<0.2 ppl).' : 'VERDICT: SUP STANDS.') + '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/enc2.json halt-r/enc2.json
          cp /tmp/enc2.md halt-r/enc2.md
          cat halt-r/enc2.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit enc2 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/enc2.json halt-r/enc2.json
            cp /tmp/enc2.md halt-r/enc2.md
            git add halt-r/enc2.json halt-r/enc2.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: enc2 trunk $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
