name: halt-r-probe
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'halt-r/probe-raw.py'
      - '.github/workflows/halt-r-probe.yml'
permissions:
  contents: write
env:
  LLAMA_BIN: /tmp/llama.cpp/build/bin
jobs:
  smoke:
    name: static smoke (syntax, flags, pins — seconds, no build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: py_compile + argparse wiring
        run: |
          python3 -m py_compile halt-r/probe-raw.py
          python3 halt-r/probe-raw.py --help
      - name: queries JSON valid + self-pin check
        run: |
          python3 -c "import json; qs=json.load(open('halt-r/exp1-queries.json')); assert len(qs)>=10, len(qs); print('queries:', len(qs))"
          grep -q "qwen2.5-0.5b-instruct-q4_k_m" .github/workflows/halt-r-probe.yml
  probe:
    name: raw completion dump (10 queries, full stdout)
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential curl python3
      - name: build llama-cli
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build --config Release -j --target llama-cli
      - name: pre-flight binary assert (single config source)
        run: |
          test -x "$LLAMA_BIN/llama-cli" || { echo "FAIL no llama-cli at $LLAMA_BIN"; exit 1; }
      - name: fetch donor
        run: |
          curl -sSL https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf -o /tmp/qwen.gguf
          wc -c /tmp/qwen.gguf
      - name: dump raw completions
        run: |
          set -o pipefail
          mkdir -p out/probe
          python3 halt-r/probe-raw.py --bin "$LLAMA_BIN" --model /tmp/qwen.gguf --queries halt-r/exp1-queries.json --out out/probe 2>&1 | tee out/probe/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-raw
          path: out/probe/
          retention-days: 30
