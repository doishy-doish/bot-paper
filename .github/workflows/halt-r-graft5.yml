name: halt-r-graft5
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-graft5.yml'
permissions:
  contents: write
jobs:
  bench:
    name: graft5 ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.proj }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        proj: [raw, graft2, graft5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: bench transplant (anchor-energy keys vs one-hot control)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/graft5-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj ${{ matrix.proj }} --H 256 --graftgguf halt-r/tinygpt-${{ matrix.corpus }}.gguf --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: graft5-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}
          path: out/graft5-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}/
          retention-days: 30
  collect:
    name: collect transplant verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: graft5-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: transplant-vs-onehot verdict
        run: |
          node - <<'EOF' | tee /tmp/graft5.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || (a.proj < b.proj ? -1 : 1));
          fs.writeFileSync('/tmp/graft5.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'graft5-transplant', preReg: 'graft5 (anchor-energy rank keys, K=512, SEED+13 anchors/SEED+14 bind) wins iff lam*>0 AND d>0.2ppl vs raw AND McNemar p<0.05. Primary shakes W16. Secondary ts W16. W8 controls (graft2 lean reference: ts W8 d=1.41 p=0.063). graft2 rows = best-fixed-key reference in same seeds.', runs}, null, 1));
          let md = '# GRAFT5: anchor-energy rank keys transplant (measured, CI)\nSame protocol (P=8000, char, no-gen). graft5: K=512 shared-probe anchors (SEED+13) in whitened donor space, RANKED cosine token keys (rank-robust, isometry-invariant — no alignment step), per-position sign bind (SEED+14), D=512 via exact sim path. graft2 = campaign-best fixed-key reference in same seeds. raw = same-workflow control.\n\n| corpus | W | proj | cost | interp acc/ppl (lam*) |\n|---|---|---|---|---|\n';
          for (const r of runs) md += '| ' + r.corpus + ' | ' + r.W + ' | ' + r.proj + ' | ' + (r.costClass || 'linear-O(P·D)') + ' | ' + r.interpAcc.toFixed(3) + '/' + r.interpPpl.toFixed(2) + ' (' + r.interpLambda + ') |\n';
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const o = runs.find(r => r.corpus === corpus && r.W === W && r.proj === 'raw');
            const contenders = [['graft5', runs.find(r => r.corpus === corpus && r.W === W && r.proj === 'graft5')], ['graft2', runs.find(r => r.corpus === corpus && r.W === W && r.proj === 'graft2')]];
            if (!o) continue;
            for (const [pname, g] of contenders) {
              if (!g) continue;
              const d = o.interpPpl - g.interpPpl;
              const pm = pair(g.repHitI || '', o.repHitI || '');
              const wins = g.interpLambda > 0 && d > 0.2 && pm.p < 0.05;
              const holds = g.interpLambda === 0;
              md += '\n' + corpus + ' W' + W + ' ' + pname + ': raw ' + o.interpPpl.toFixed(2) + ' (lam*=' + o.interpLambda + ') vs ' + pname + ' ' + g.interpPpl.toFixed(2) + ' (lam*=' + g.interpLambda + ') d=' + d.toFixed(2) + '. McNemar ' + pname + '-vs-raw b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + (pm.p < 0.05 ? ' SIGNIFICANT.' : '.') + ' ' + (wins ? 'VERDICT: TRANSPLANT WINS (' + pname + ' beats one-hot).' : holds ? 'VERDICT: WALL STANDS (' + pname + ' adds nothing).' : 'VERDICT: leans ' + pname + ', not significant.') + '\n';
            }
          }
          process.stdout.write(md);
          EOF
          cp /tmp/graft5.json halt-r/graft5.json
          cp /tmp/graft5.md halt-r/graft5.md
          cat halt-r/graft5.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit graft5 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/graft5.json halt-r/graft5.json
            cp /tmp/graft5.md halt-r/graft5.md
            git add halt-r/graft5.json halt-r/graft5.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: graft5 anchor-energy verdict $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
