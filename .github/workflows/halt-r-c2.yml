name: halt-r-c2
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-c2.yml'
permissions:
  contents: write
jobs:
  bench:
    name: c2 ${{ matrix.corpus }} W${{ matrix.W }} canary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          head -c 200 /tmp/corpus.txt
      - name: bench canary edit plus exact forget
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/c2-${{ matrix.corpus }}-W${{ matrix.W }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj sup --H 256 --ada 0 --score whole --capab canary --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: c2-${{ matrix.corpus }}-W${{ matrix.W }}
          path: out/c2-${{ matrix.corpus }}-W${{ matrix.W }}/
          retention-days: 30
  collect:
    name: collect canary verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: c2-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: canary table plus verdict
        run: |
          node - <<'EOF' | tee /tmp/c2.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          try { walk('models'); } catch (e) { console.log('no metrics found'); process.exit(0); }
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W);
          fs.writeFileSync('/tmp/c2.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'c2-canary-unlearn', runs}, null, 1));
          let md = '# C2: implanted facts, edit flips, exact forget\nSame protocol as H1 (P=8000, sup, fixed lam, no-gen) + canary phases in one job. remember/edit/forget on 20 implanted facts; collateral = standard q100 acc before/after deletion.\n\n| corpus | W | remember | editFlip | forgetLeak | collateral base -> after |\n|---|---|---|---|---|---|\n';
          for (const m of runs) {
            md += '| ' + m.corpus + ' | ' + m.W + ' | ' + m.canRemember.toFixed(2) + ' | ' + m.canEditFlip.toFixed(2) + ' | ' + m.canForgetLeak.toFixed(3) + ' | ' + m.collatBase.toFixed(3) + ' -> ' + m.collatAfter.toFixed(3) + ' |\n';
          }
          let proven = 0;
          for (const m of runs) {
            const dc = Math.abs(m.collatAfter - m.collatBase);
            const ok = m.canRemember >= 0.95 && m.canForgetLeak === 0 && dc <= 0.02;
            if (ok) proven++;
            md += '\n' + m.corpus + ' W' + m.W + ': remember=' + m.canRemember.toFixed(2) + ' leak=' + m.canForgetLeak.toFixed(3) + ' |dcollat|=' + dc.toFixed(3) + ' -> ' + (ok ? 'EXACT UNLEARNING PROVEN (implant recalled, deletion total, no collateral).' : 'NOT PROVEN (needs inspection).');
          }
          md += '\n\n' + proven + '/' + runs.length + ' configs with exact, collateral-free forgetting.\n';
          process.stdout.write(md);
          EOF
          cp /tmp/c2.json halt-r/c2.json
          cp /tmp/c2.md halt-r/c2.md
          cat halt-r/c2.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit c2 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/c2.json halt-r/c2.json
            cp /tmp/c2.md halt-r/c2.md
            git add halt-r/c2.json halt-r/c2.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: c2 canary-unlearn $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
