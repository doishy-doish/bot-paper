name: paper-tick
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 "https://x-access-token:${BRAIN_PAT}@github.com/doishy-doish/bot-paper-brain.git" /tmp/brain
          mkdir -p scripts
          cp /tmp/brain/scripts/tick.mjs ./scripts/_brain_tick.mjs
          node ./scripts/_brain_tick.mjs
          rm -f ./scripts/_brain_tick.mjs
        env:
          BRAIN_PAT: ${{ secrets.BRAIN_PAT }}
      - run: |
          git config user.name "paper-tick"
          git config user.email "paper-tick@users.noreply.github.com"
          git add data/paper.json
          git diff --cached --quiet || git commit -m "tick $(date -u +%F)"
          git push
