name: paper-tick
# Scrambled variant (simple / standalone tick.mjs with no brain clone).
# data/paper.json on disk is AES-256-GCM ciphertext; tick.mjs decrypts in
# memory when SCRAMBLE_KEY is set and re-encrypts before writing, logs stay
# quiet (counts + hashes only). See SCRAMBLE.md for the pull/decrypt side.
# Triggers stay schedule/dispatch ONLY — never add pull_request.
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/tick.mjs
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
      - run: node scripts/scramble.mjs encrypt data/paper.json
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
      - run: |
          git config user.name "paper-tick"
          git config user.email "paper-tick@users.noreply.github.com"
          git add data/paper.json
          git diff --cached --quiet || git commit -m "tick $(date -u +%F)"
          git push
