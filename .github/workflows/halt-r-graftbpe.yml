name: halt-r-graftbpe
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-graftbpe.yml'
permissions:
  contents: write
jobs:
  bench:
    name: graftbpe ts W${{ matrix.W }} ${{ matrix.proj }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        W: [8, 16]
        proj: [raw, graft5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public TinyStories head)
        run: |
          curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          wc -c /tmp/corpus.txt
      - name: bench BPE-graft compose (same-tokenizer internal verdict)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: |
          POOLFLAGS=""; if [ "${{ matrix.proj }}" = "graft5" ]; then POOLFLAGS="--anchors 256 --graftgguf halt-r/tinygpt-ts.gguf --pool mean"; fi
          node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/graftbpe-ts-W${{ matrix.W }}-${{ matrix.proj }} --tag ts --W ${{ matrix.W }} --P 8000 --trials 100 --proj ${{ matrix.proj }} --H 256 --tok bpe $POOLFLAGS --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: graftbpe-ts-W${{ matrix.W }}-${{ matrix.proj }}
          path: out/graftbpe-ts-W${{ matrix.W }}-${{ matrix.proj }}/
          retention-days: 30
  collect:
    name: collect compose verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: graftbpe-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: compose verdict (internal, same tokenizer)
        run: |
          node - <<'EOF' | tee /tmp/graftbpe.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.W - b.W) || (a.proj < b.proj ? -1 : 1));
          fs.writeFileSync('/tmp/graftbpe.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'graftbpe compose', preReg: 'ts W8/W16, P=8000, BPE (internal verdict, same tokenizer). graft5-bpe-K256 wins iff lam*>0 AND d>0.2ppl vs same-workflow raw-bpe AND McNemar p<0.05. Primary ts-W16 (walled); must-retain ts-W8 (won config).', runs}, null, 1));
          let md = '# GRAFTBPE: BPE-graft compose (measured, CI)\nts W8/W16, P=8000, BPE-256, no-gen, T100. Internal verdict (same tokenizer; no cross-tokenizer claims).\n\n| W | proj | interp acc/ppl (lam*) |\n|---|---|---|\n';
          for (const r of runs) md += '| ' + r.W + ' | ' + r.proj + ' | ' + r.interpAcc.toFixed(3) + '/' + r.interpPpl.toFixed(2) + ' (' + r.interpLambda + ') |\n';
          for (const W of [16, 8]) {
            const o = runs.find(r => r.W === W && r.proj === 'raw');
            const g = runs.find(r => r.W === W && r.proj === 'graft5');
            if (!o || !g) continue;
            const d = o.interpPpl - g.interpPpl;
            const pm = pair(g.repHitI || '', o.repHitI || '');
            const wins = g.interpLambda > 0 && d > 0.2 && pm.p < 0.05;
            md += '\nW=' + W + ': raw-bpe ' + o.interpPpl.toFixed(2) + ' vs graft5-bpe ' + g.interpPpl.toFixed(2) + ' d=' + d.toFixed(2) + ' b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + ' → ' + (wins ? 'WINS' : 'stands') + '.\n';
          }
          md += '\nRead: W16 win = scope expands (compositional alignment); W8-retain fail = pooling destroys geometry (compose dead, Track 3 only).\n';
          process.stdout.write(md);
          EOF
          cp /tmp/graftbpe.json halt-r/graftbpe.json
          cp /tmp/graftbpe.md halt-r/graftbpe.md
          cat halt-r/graftbpe.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit compose back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/graftbpe.json halt-r/graftbpe.json
            cp /tmp/graftbpe.md halt-r/graftbpe.md
            git add halt-r/graftbpe.json halt-r/graftbpe.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: graftbpe verdict $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
