name: halt-r-remap-t200
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-remap-t200.yml'
permissions:
  contents: write
jobs:
  bench:
    name: remap-t200 ${{ matrix.arm }} (W16, T200 queries)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        arm: [sup, graft5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: remake remap corpus (deterministic, byte-identical)
        run: |
          python3 halt-r/make-arith-remap.py --out /tmp/remap --W 16
          [ $(wc -c < /tmp/remap/remap-full.txt) -gt 50000 ] || (echo "FAIL corpus too small"; exit 1)
          wc -c /tmp/remap/remap-full.txt
      - name: bench remap transfer leg (T200 = 200 distinct queries)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: |
          FLAGS="--W 16 --P 8000 --trials 200 --H 256 --no-gen --split 1 --hedge 1"
          if [ "${{ matrix.arm }}" = sup ]; then
            FLAGS="$FLAGS --proj sup --mix none"
          else
            FLAGS="$FLAGS --proj graft5 --anchors 256 --graftemb hf,Qwen/Qwen2.5-0.5B-Instruct,model.safetensors --mix none"
          fi
          node halt-r/lm-shakespeare.mjs --data /tmp/remap/remap-full.txt --out out/remap-t200-${{ matrix.arm }} --tag arith-remap $FLAGS
      - uses: actions/upload-artifact@v4
        with:
          name: remap-t200-${{ matrix.arm }}
          path: out/remap-t200-${{ matrix.arm }}/
          retention-days: 30
  collect:
    name: collect remap T200 verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: remap-t200-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: remap T200 verdict (powered replicate, power branch)
        run: |
          node - <<'EOF' | tee /tmp/remap-t200.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
              return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => { const m = JSON.parse(fs.readFileSync(f, 'utf8')); m._art = f; return m; });
          const sup = runs.find(r => r._art.includes('remap-t200-sup'));
          const gr5 = runs.find(r => r._art.includes('remap-t200-graft5'));
          if (!sup || !gr5) { console.log('FAIL missing bench arms'); process.exit(1); }
          if (sup.trials !== 200 || gr5.trials !== 200) { console.log('FAIL trials!=200'); process.exit(1); }
          const pm = pair(gr5.repHitI || '', sup.repHitI || '');
          const d = sup.interpPpl - gr5.interpPpl;
          const ratio = pm.c > 0 ? pm.b / pm.c : (pm.b > 0 ? 99 : 0);
          const wins = gr5.interpLambda > 0 && d > 0.2 && pm.p < 0.05;
          const powBranch = d > 0.5 && ratio > 1.5;
          fs.writeFileSync('/tmp/remap-t200.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'remap-t200', preReg: 'scratch/papers/remap-t200-prereg-2026-11-15.md', sup: {acc: sup.interpAcc, ppl: sup.interpPpl, lam: sup.interpLambda, trials: sup.trials}, graft5: {acc: gr5.interpAcc, ppl: gr5.interpPpl, lam: gr5.interpLambda, trials: gr5.trials}, d: d, mcNemar: pm, ratio: +ratio.toFixed(2)}, null, 1));
          let verdict;
          if (wins) verdict = 'VERDICT: WIN REPLICATES at power (remap within-task transfer holds; C1 next on a properly constructed donor-unknown corpus).';
          else if (powBranch) verdict = 'VERDICT: NULL at T200 but power branch open (direction-right + d>0.5) - T400 may be pre-registered once, else lead closes.';
          else if (gr5.interpLambda === 0) verdict = 'VERDICT: WALL STANDS at T200 (graft adds nothing).';
          else verdict = 'VERDICT: NULL at T200 (lead killed per kill line; program = system-assets + C1).';
          process.stdout.write('# REMAP-T200: powered replicate of the GOLD-1 lean (measured, CI)\nRemap corpus (digit-permuted revbal mirror, W16), 200 distinct queries, same SEED streams as GOLD-1 T100. Graft5-K256 vs same-run sup.\n\n| arm | acc/ppl (lam*) | trials |\n|---|---|---|\n| sup | ' + sup.interpAcc.toFixed(3) + '/' + sup.interpPpl.toFixed(2) + ' (' + sup.interpLambda + ') | ' + sup.trials + ' |\n| graft5 | ' + gr5.interpAcc.toFixed(3) + '/' + gr5.interpPpl.toFixed(2) + ' (' + gr5.interpLambda + ') | ' + gr5.trials + ' |\n\ngraft5-vs-sup d=' + d.toFixed(2) + ' McNemar b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(4) + ' ratio=' + ratio.toFixed(2) + '. ' + verdict + '\n');
          EOF
          cp /tmp/remap-t200.json halt-r/remap-t200.json
          cp /tmp/remap-t200.md halt-r/remap-t200.md
          cat halt-r/remap-t200.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit T200 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/remap-t200.json halt-r/remap-t200.json
            cp /tmp/remap-t200.md halt-r/remap-t200.md
            git add halt-r/remap-t200.json halt-r/remap-t200.md .github/workflows/halt-r-remap-t200.yml
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: remap T200 verdict $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
