name: halt-r-combo
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-combo.yml'
permissions:
  contents: write
jobs:
  bench:
    name: combo ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.arm }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [ts, shakes]
        W: [32]
        arm: [interp, gpt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: check gptq present (baseline rev-2 must have landed)
        run: test -f halt-r/q100-gpt-${{ matrix.corpus }}.json || (echo "q100-gpt missing"; exit 1)
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: bench combo (grafted keys K=256 + donor values + router)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: |
          FLAGS="--proj graft5 --anchors 256 --graftgguf halt-r/tinygpt-${{ matrix.corpus }}.gguf"
          if [ "${{ matrix.arm }}" = gpt ]; then
            FLAGS="$FLAGS --mix gpt --gptq halt-r/q100-gpt-${{ matrix.corpus }}.json"
          fi
          node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/combo-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.arm }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 $FLAGS --H 256 --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: combo-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.arm }}
          path: out/combo-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.arm }}/
          retention-days: 30
  collect:
    name: collect combo verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: combo-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: combo verdict (blend of delegation + absorption)
        run: |
          node - <<'EOF' | tee /tmp/combo.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W);
          fs.writeFileSync('/tmp/combo.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'combo', preReg: 'combo (graft5 K=256 keys + donor values via --mix gpt, same seeds) wins iff gptMixPpl beats same-config interpPpl by >0.2 AND cross-job paired McNemar (repHitG vs interp repHitI) p<0.05. Primary ts W32 (the gmix-won config; W8/16 void 2026-11-13: trainer q100 joins on pos iff bench W == trainer block 32). Router discipline: lam selected on seed-2000, locked on seed-2001 (same as every arm).', runs}, null, 1));
          let md = '# COMBO: grafted keys (K=256) + donor values + router (measured, CI)\nSame protocol (P=8000, char, no-gen, T100). interp arm = graft5 keys + bigram (absorption alone). gpt arm = graft5 keys + frozen donor dists (absorption + delegation, the feast). Cross-job paired test (same seeds/queries).\n\n| corpus | W | arm | interp acc/ppl (lam*) | gpt-mix acc/ppl (lam*) | cover |\n|---|---|---|---|---|---|\n';
          for (const corpus of ['ts', 'shakes']) for (const W of [32]) {
            const ii = runs.find(r => r.corpus === corpus && r.W === W && r.mix === 'none');
            const gg = runs.find(r => r.corpus === corpus && r.W === W && r.mix === 'gpt');
            if (!ii || !gg) continue;
            md += '| ' + corpus + ' | ' + W + ' | interp | ' + ii.interpAcc.toFixed(3) + '/' + ii.interpPpl.toFixed(2) + ' (' + ii.interpLambda + ') | — | — |\n';
            md += '| ' + corpus + ' | ' + W + ' | gpt | — | ' + gg.gptMixAcc.toFixed(3) + '/' + gg.gptMixPpl.toFixed(2) + ' (' + gg.gptMixLamSel + ') | ' + gg.gptCover + '/100 |\n';
            const d = ii.interpPpl - gg.gptMixPpl;
            const pm = pair(gg.repHitG || '', ii.repHitI || '');
            const wins = d > 0.2 && pm.p < 0.05;
            md += '\n' + corpus + ' W' + W + ' combo: interp ' + ii.interpPpl.toFixed(2) + ' vs gpt-mix ' + gg.gptMixPpl.toFixed(2) + ' d=' + d.toFixed(2) + '. McNemar gpt-vs-interp b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + (pm.p < 0.05 ? ' SIGNIFICANT.' : '.') + ' ' + (wins ? 'VERDICT: BLEND WINS (keys + values + router beat keys alone).' : gg.gptCover < 100 ? 'VERDICT: coverage-starved (' + gg.gptCover + '/100 — diagnose pos-join, not a model result).' : 'VERDICT: blend stands (values add nothing here).') + '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/combo.json halt-r/combo.json
          cp /tmp/combo.md halt-r/combo.md
          cat halt-r/combo.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit combo back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/combo.json halt-r/combo.json
            cp /tmp/combo.md halt-r/combo.md
            git add halt-r/combo.json halt-r/combo.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: combo blend verdict $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
