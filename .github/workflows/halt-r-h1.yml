name: halt-r-h1
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-h1.yml'
permissions:
  contents: write
jobs:
  bench:
    name: h1 ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.proj }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [shakes, ts]
        W: [8, 16]
        proj: [raw, sim, sup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          head -c 200 /tmp/corpus.txt
      - name: bench
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/h1-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj ${{ matrix.proj }} --H 256 --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: h1-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}
          path: out/h1-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.proj }}/
          retention-days: 30
  collect:
    name: collect h1 (learned encoder ablation)
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: h1-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ablation table + verdict
        run: |
          node - <<'EOF' | tee /tmp/h1.md
          const fs = require('node:fs'), path = require('node:path');
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          try { walk('models'); } catch (e) { console.log('no metrics found'); process.exit(0); }
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W || (a.proj < b.proj ? -1 : 1));
          fs.writeFileSync('/tmp/h1.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'h1-learned-encoder', runs}, null, 1));
          let md = '# H1: learned encoder (position-scaled projection) vs raw vs SimHash\nSame protocol as lm bench (90/10 split, seed-2000 select, seed-2001 locked report, P=8000, H=256, no-gen). Question: does the learned encoder break the W16 wall where retrieval provably contributes nothing (lam*=0 at all P)?\n\n| corpus | W | proj | interp acc/ppl (lam*) | hop acc/ppl | bigram acc/ppl |\n|---|---|---|---|---|---|\n';
          for (const m of runs) md += `| ${m.corpus} | ${m.W} | ${m.proj} | ${m.interpAcc.toFixed(3)}/${m.interpPpl.toFixed(2)} (${m.interpLambda}) | ${m.acc.toFixed(3)}/${m.ppl.toFixed(2)} | ${m.bigramAcc.toFixed(3)}/${m.bigramPpl.toFixed(2)} |\n`;
          for (const corpus of ['shakes', 'ts']) for (const W of [8, 16]) {
            const g = runs.filter(m => m.corpus === corpus && m.W === W);
            if (g.length < 3) continue;
            const sim = g.find(m => m.proj === 'sim'), sup = g.find(m => m.proj === 'sup');
            md += `\n${corpus} W${W}: sim lam*=${sim.interpLambda} interpPpl=${sim.interpPpl.toFixed(2)} vs sup lam*=${sup.interpLambda} interpPpl=${sup.interpPpl.toFixed(2)} (bigram ${sup.bigramPpl.toFixed(2)}). `;
            md += (sup.interpLambda > 0 && sup.interpPpl < sim.interpPpl)
              ? 'VERDICT: WALL MOVES under learned encoder (retrieval contributes, ppl improves).'
              : (sup.interpLambda === 0
                ? 'VERDICT: WALL STANDS (learned encoder still contributes nothing at this P). Next: P-sweep under sup.'
                : 'VERDICT: PARTIAL (retrieval contributes but ppl does not improve).');
            md += '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/h1.json halt-r/h1.json
          cp /tmp/h1.md halt-r/h1.md
          cat halt-r/h1.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit h1 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/h1.json halt-r/h1.json
            cp /tmp/h1.md halt-r/h1.md
            git add halt-r/h1.json halt-r/h1.md
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: h1 learned-encoder ablation $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
