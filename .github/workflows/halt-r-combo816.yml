name: halt-r-combo816
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-combo816.yml'
permissions:
  contents: write
jobs:
  train:
    name: combo816 donor ${{ matrix.corpus }} (frozen after train)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - corpus: shakes
            iters: 6000
          - corpus: ts
            iters: 9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install torch CPU
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: train tiny donor (CPU, converged settings)
        run: python3 halt-r/train-tiny-lm.py --data /tmp/corpus.txt --out out/donor --tag ${{ matrix.corpus }} --block 32 --iters ${{ matrix.iters }}
      - name: export donor GGUF (graft5 key source)
        run: python3 halt-r/export-gguf.py --pt out/donor/tiny.pt --vocab out/donor/vocab.json --ref out/donor/ref-${{ matrix.corpus }}.json --out out/donor/tinygpt-${{ matrix.corpus }}.gguf
      - name: emit W-matched donor dists (bench-joinable, cover 100/100 by construction)
        run: |
          python3 halt-r/emit-q100.py --pt out/donor/tiny.pt --vocab out/donor/vocab.json --data /tmp/corpus.txt --W 8 --trials 100 --tag ${{ matrix.corpus }}-w8 --out out/donor
          cp out/donor/donor-alone.json out/donor/donor-alone-${{ matrix.corpus }}-w8.json
          python3 halt-r/emit-q100.py --pt out/donor/tiny.pt --vocab out/donor/vocab.json --data /tmp/corpus.txt --W 16 --trials 100 --tag ${{ matrix.corpus }}-w16 --out out/donor
          cp out/donor/donor-alone.json out/donor/donor-alone-${{ matrix.corpus }}-w16.json
          rm out/donor/donor-alone.json
      - uses: actions/upload-artifact@v4
        with:
          name: combo816-donor-${{ matrix.corpus }}
          path: out/donor/
          retention-days: 30
  bench:
    name: combo816 ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.arm }}
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        corpus: [ts, shakes]
        W: [8, 16]
        arm: [interp, gpt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: combo816-donor-${{ matrix.corpus }}
          path: models/donor/
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
      - name: bench combo816 (grafted keys K=256 + donor values + router)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: |
          FLAGS="--proj graft5 --anchors 256 --graftgguf models/donor/tinygpt-${{ matrix.corpus }}.gguf"
          if [ "${{ matrix.arm }}" = gpt ]; then
            FLAGS="$FLAGS --mix gpt --gptq models/donor/q100-gpt-${{ matrix.corpus }}-w${{ matrix.W }}.json"
          fi
          node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/combo816-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.arm }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 $FLAGS --H 256 --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: combo816-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.arm }}
          path: out/combo816-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.arm }}/
          retention-days: 30
  collect:
    name: collect combo816 verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: combo816-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: combo816 verdict (W-matched blend of delegation + absorption)
        run: |
          node - <<'EOF' | tee /tmp/combo816.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => JSON.parse(fs.readFileSync(f, 'utf8')));
          runs.sort((a, b) => (a.corpus < b.corpus ? -1 : 1) || a.W - b.W);
          fs.writeFileSync('/tmp/combo816.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'combo816', preReg: 'combo816 (graft5 K=256 keys + W-matched donor dists via emit-q100, same seeds) wins iff gptMixPpl beats same-config interpPpl by >0.2 AND cross-job paired McNemar (repHitG vs interp repHitI) p<0.05. Primary ts W8 (graft5-won config). Cover 100/100 by construction; cover<100 means emit/bench sampling drift, diagnose, not a model result.', runs}, null, 1));
          let md = '# COMBO816: grafted keys (K=256) + W-matched donor values + router (measured, CI)\nSame protocol (P=8000, char, no-gen, T100). interp arm = graft5 keys + bigram (absorption alone). gpt arm = graft5 keys + frozen donor dists at the same W (absorption + delegation). Cross-job paired test (same seeds/queries).\n\n| corpus | W | arm | interp acc/ppl (lam*) | gpt-mix acc/ppl (lam*) | cover |\n|---|---|---|---|---|---|\n';
          for (const corpus of ['ts', 'shakes']) for (const W of [8, 16]) {
            const ii = runs.find(r => r.corpus === corpus && r.W === W && r.mix === 'none');
            const gg = runs.find(r => r.corpus === corpus && r.W === W && r.mix === 'gpt');
            if (!ii || !gg) continue;
            md += '| ' + corpus + ' | ' + W + ' | interp | ' + ii.interpAcc.toFixed(3) + '/' + ii.interpPpl.toFixed(2) + ' (' + ii.interpLambda + ') | — | — |\n';
            md += '| ' + corpus + ' | ' + W + ' | gpt | — | ' + gg.gptMixAcc.toFixed(3) + '/' + gg.gptMixPpl.toFixed(2) + ' (' + gg.gptMixLamSel + ') | ' + gg.gptCover + '/100 |\n';
            const d = ii.interpPpl - gg.gptMixPpl;
            const pm = pair(gg.repHitG || '', ii.repHitI || '');
            const wins = d > 0.2 && pm.p < 0.05;
            md += '\n' + corpus + ' W' + W + ' combo816: interp ' + ii.interpPpl.toFixed(2) + ' vs gpt-mix ' + gg.gptMixPpl.toFixed(2) + ' d=' + d.toFixed(2) + '. McNemar gpt-vs-interp b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + (pm.p < 0.05 ? ' SIGNIFICANT.' : '.') + ' ' + (wins ? 'VERDICT: BLEND WINS (keys + values + router beat keys alone).' : gg.gptCover < 100 ? 'VERDICT: sampling drift (' + gg.gptCover + '/100 — diagnose emit/bench join, not a model result).' : 'VERDICT: blend stands (values add nothing here).') + '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/combo816.json halt-r/combo816.json
          cp /tmp/combo816.md halt-r/combo816.md
          cat halt-r/combo816.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit combo816 back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/combo816.json halt-r/combo816.json
            cp /tmp/combo816.md halt-r/combo816.md
            for corpus in ts shakes; do
              for w in 8 16; do
                src=$(find models -name "q100-gpt-$corpus-w$w.json" | head -1)
                if [ -n "$src" ]; then cp "$src" halt-r/q100-gpt-$corpus-w$w.json; fi
                src=$(find models -name "donor-alone-$corpus-w$w.json" | head -1)
                if [ -n "$src" ]; then cp "$src" halt-r/donor-alone-$corpus-w$w.json; fi
              done
            done
            git add halt-r/combo816.json halt-r/combo816.md halt-r/q100-gpt-ts-w8.json halt-r/q100-gpt-ts-w16.json halt-r/q100-gpt-shakes-w8.json halt-r/q100-gpt-shakes-w16.json halt-r/donor-alone-ts-w8.json halt-r/donor-alone-ts-w16.json halt-r/donor-alone-shakes-w8.json halt-r/donor-alone-shakes-w16.json
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: combo816 blend verdict $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
