name: halt-r-segword
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/halt-r-segword.yml'
permissions:
  contents: write
jobs:
  bench:
    name: segword ${{ matrix.corpus }} W${{ matrix.W }} ${{ matrix.tok }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - corpus: ts
            W: 16
            tok: char
          - corpus: ts
            W: 16
            tok: word
          - corpus: ts
            W: 8
            tok: char
          - corpus: ts
            W: 8
            tok: word
          - corpus: shakes
            W: 8
            tok: char
          - corpus: shakes
            W: 8
            tok: word
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check wrap key present
        run: if [ -z "${{ secrets.SCRAMBLE }}" ]; then echo "SCRAMBLE secret missing - refusing plaintext save"; exit 1; fi
      - name: fetch corpus (public domain / public research text)
        run: |
          if [ "${{ matrix.corpus }}" = ts ]; then
            curl -sSL --fail -r 0-3000000 --max-filesize 6000000 https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt -o /tmp/corpus.txt
          else
            curl -sSL --fail https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/corpus.txt
          fi
          wc -c /tmp/corpus.txt
          test $(wc -c < /tmp/corpus.txt) -gt 100000 || (echo "corpus fetch too small - refusing 404-body run"; exit 1)
      - name: bench SEG-word (word-token windows, W in words)
        env:
          SCRAMBLE: ${{ secrets.SCRAMBLE }}
        run: node halt-r/lm-shakespeare.mjs --data /tmp/corpus.txt --out out/segword-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.tok }} --tag ${{ matrix.corpus }} --W ${{ matrix.W }} --P 8000 --trials 100 --proj raw --H 256 --tok ${{ matrix.tok }} --no-gen
      - uses: actions/upload-artifact@v4
        with:
          name: segword-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.tok }}
          path: out/segword-${{ matrix.corpus }}-W${{ matrix.W }}-${{ matrix.tok }}/metrics.json
          retention-days: 30
  collect:
    name: collect SEG-word verdict
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: segword-*
          path: models/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: segword verdict (within-tokenizer paired bar)
        run: |
          node - <<'EOF' | tee /tmp/segword.md
          const fs = require('node:fs'), path = require('node:path');
          const mcP = (b, c) => { const n = b + c; if (!n) return 1; const lo = Math.min(b, c);
            let pk = Math.pow(0.5, n), tail = pk;
            for (let k = 1; k <= lo; k++){ pk = pk * (n - k + 1) / k; tail += pk; }
            return Math.min(1, 2 * tail); };
          const pair = (s1, s2) => { let b = 0, c = 0;
            for (let i = 0; i < Math.min(s1.length, s2.length); i++){ const a = s1[i], d = s2[i];
              if (a === 'x' || d === 'x') continue;
              if (a === '1' && d === '0') b++; if (a === '0' && d === '1') c++; }
            return {b, c, p: mcP(b, c)}; };
          const files = [];
          const walk = d => { for (const e of fs.readdirSync(d, {withFileTypes:true})) { const p = path.join(d, e.name); if (e.isDirectory()) walk(p); else if (e.name === 'metrics.json') files.push(p); } };
          walk('models');
          const runs = files.map(f => { const m = JSON.parse(fs.readFileSync(f, 'utf8')); m._art = f; return m; });
          const cell = (corpus, W, tok) => runs.find(r => r.corpus === corpus && r.W === W && r.tok === tok);
          fs.writeFileSync('/tmp/segword.json', JSON.stringify({date: new Date().toISOString().slice(0,10), task: 'segword', preReg: 'scratch/papers/segword-prereg-2026-11-14.md: word run wins iff lam*>0 AND d>0.2ppl vs bigram AND McNemar(repHitI,repHitB) p<0.05. Primary ts-W16; must-retain ts-W8; diagnostic shakes-W8. Cross-tokenizer reads descriptive.', runs}, null, 1));
          let md = '# SEGWORD: content-native word windows (measured, CI)\nW in words (TOK=word, vocab cap 2000), proj raw, P=8000, no-gen, T100. Paired bar within-tokenizer; cross-tokenizer reads descriptive.\n\n| corpus | W | tok | interp acc/ppl (lam*) | bigram ppl |\n|---|---|---|---|---|\n';
          for (const r of runs) md += '| ' + r.corpus + ' | ' + r.W + ' | ' + r.tok + ' | ' + r.interpAcc.toFixed(3) + '/' + r.interpPpl.toFixed(2) + ' (' + r.interpLambda + ') | ' + r.bigramPpl.toFixed(2) + ' |\n';
          for (const [corpus, W, role] of [['ts', 16, 'PRIMARY (walled)'], ['ts', 8, 'MUST-RETAIN (won)'], ['shakes', 8, 'DIAGNOSTIC (works)']]) {
            const w = cell(corpus, W, 'word');
            if (!w) { md += '\n' + corpus + ' W' + W + ': word arm MISSING.\n'; continue; }
            const d = w.bigramPpl - w.interpPpl;
            const pm = pair(w.repHitI || '', w.repHitB || '');
            const wins = w.interpLambda > 0 && d > 0.2 && pm.p < 0.05;
            md += '\n' + corpus + ' W' + W + ' word ' + role + ': bigram ' + w.bigramPpl.toFixed(2) + ' vs interp ' + w.interpPpl.toFixed(2) + ' (lam*=' + w.interpLambda + ') d=' + d.toFixed(2) + ' McNemar b/c=' + pm.b + '/' + pm.c + ' p=' + pm.p.toFixed(3) + (pm.p < 0.05 ? ' SIGNIFICANT.' : '.') + ' ' + (wins ? 'VERDICT: WIN (scope expands via content alignment).' : w.interpLambda === 0 ? 'VERDICT: WALL STANDS at W' + W + ' word (adds nothing).' : 'VERDICT: NULL (sub-bar).') + '\n';
          }
          process.stdout.write(md);
          EOF
          cp /tmp/segword.json halt-r/segword.json
          cp /tmp/segword.md halt-r/segword.md
          cat halt-r/segword.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit segword back
        run: |
          git config user.name "halt-r-sweep"
          git config user.email "halt-r-sweep@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/segword.json halt-r/segword.json
            cp /tmp/segword.md halt-r/segword.md
            git add halt-r/segword.json halt-r/segword.md .github/workflows/halt-r-segword.yml
            git diff --cached --quiet && exit 0
            git commit -m "halt-r: segword verdict $(date -u +%F)" && git push origin main && exit 0
            sleep 5
          done
          exit 1
